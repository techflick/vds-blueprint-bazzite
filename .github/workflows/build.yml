name: Build Mein Bazzite Image
on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  bluebuild:
    name: Build Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Build Image
        uses: blue-build/github-action@v1
        with:
          recipe: 'config/recipe.yml'
          registry_token: ${{ github.token }}
          prune: true
        # Hier erzwingen wir die Deaktivierung direkt als Umgebungsvariable:
        env:
          BB_NO_SIGN: "true"
