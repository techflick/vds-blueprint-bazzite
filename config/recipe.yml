# GitHub Bauplan für ein angepasstes Bazzite mit vDS
name: mein-bazzite-vds
description: Mein persönliches Bazzite mit integriertem vDS (virtual DualSense) Treiber.

base-image: ghcr.io/ublue-os/bazzite
image-version: latest

modules:
  # 1. Das vDS Kernel-Modul in der Cloud kompilieren
  - type: akmods
    install:
      - vds

  # 2. Das Userspace-Programm (vdsd) nativ aus dem Quellcode bauen und installieren
  - type: script
    snippets:
      - |
        echo "Installiere kurzzeitig Build-Tools im Image..."
        rpm-ostree install -y git cmake gcc-c++ opus-devel libudev-devel dbus-devel bluez-libs-devel
        
        echo "Klone das vDS-Repository..."
        git clone https://github.com/hurryman2212/vds.git /tmp/vds_source
        
        echo "Kompiliere das Userspace-Programm..."
        cd /tmp/vds_source
        cmake . -B build
        make -C build
        
        echo "Kopiere die fertigen Programme in das System..."
        cp build/vdsd /usr/bin/vdsd
        cp build/vdsctl /usr/bin/vdsctl
        
        echo "Aktiviere den Bluetooth-Override..."
        chmod +x override-bluetoothd.sh
        ./override-bluetoothd.sh disable-input
