# yaml-language-server: $schema=https://blue-build.org
name: mein-bazzite-vds
description: Mein persönliches Bazzite mit automatischer Aktivierung des vDS (virtual DualSense) Treibers.

base-image: ghcr.io/ublue-os/bazzite
image-version: latest

modules:
  # Wir hinterlassen im Image nur Konfigurationen, damit Bazzite den Treiber lädt
  - type: script
    snippets:
      - |
        echo "=== 1. Kernel-Modul für den Systemstart registrieren ==="
        # Das sagt Bazzite beim Booten, dass es den virtuellen Audio-Treiber vds_hcd aktivieren soll
        mkdir -p /etc/modules-load.d
        echo "vds_hcd" > /etc/modules-load.d/vds.conf

        echo "=== 2. Bluetooth-Anpassung aktivieren ==="
        # Wir zwingen Bluetooth dazu, das Eingabe-Plugin zu ignorieren, damit vdsd freien Zugriff hat
        mkdir -p /etc/systemd/system/bluetooth.service.d
        cat << 'EOF' > /etc/systemd/system/bluetooth.service.d/override.conf
        [Service]
        ExecStart=
        ExecStart=/usr/libexec/bluetooth/bluetoothd --noplugin=input
        EOF
