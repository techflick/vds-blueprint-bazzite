# GitHub Bauplan für ein angepasstes Bazzite mit vDS
name: mein-bazzite-vds
description: Mein persönliches Bazzite mit integriertem vDS (virtual DualSense) Treiber.

base-image: ghcr.io/ublue-os/bazzite
image-version: latest

modules:
  - type: script
    snippets:
      - |
        echo "=== 1. Installiere notwendige Build-Werkzeuge ==="
        rpm-ostree install -y git cmake gcc-c++ opus-devel libudev-devel dbus-devel bluez-libs-devel kernel-devel

        echo "=== 2. Klone das vDS-Repository ==="
        # HIER BITTE DEINEN ECHTEN, VOLLSTÄNDIGEN GIT-LINK EINSETZEN:
        git clone https://github.com/hurryman2212/vds.git /tmp/vds_source
        
        cd /tmp/vds_source

        echo "=== 3. Kompiliere und installiere das Kernel-Modul ==="
        cd module
        make
        KERNEL_VER=$(rpm -q kernel --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}\n' | head -n 1)
        mkdir -p /usr/lib/modules/${KERNEL_VER}/extra/
        cp vds_hcd.ko /usr/lib/modules/${KERNEL_VER}/extra/
        
        echo "=== 4. Kompiliere und installiere das Steuerprogramm ==="
        cd /tmp/vds_source
        cmake . -B build
        make -C build
        cp build/vdsd /usr/bin/vdsd
        cp build/vdsctl /usr/bin/vdsctl

        echo "=== 5. Bluetooth-Anpassung aktivieren ==="
        chmod +x override-bluetoothd.sh
        ./override-bluetoothd.sh disable-input
