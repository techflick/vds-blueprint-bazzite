# yaml-language-server: $schema=https://blue-build.org
name: vds-blueprint-bazzite
description: "Personalized Bazzite image featuring native integration of the vDS driver and daemon (v0.4.0), operating entirely in userspace"
base-image: ghcr.io/ublue-os/bazzite
image-version: latest

modules:
  - type: rpm-ostree
    install:
      - kernel-devel
      - make
      - gcc
      - gcc-c++
      - cmake
      - git
      - dbus-devel
      - opus-devel
      - rpm-build
      - systemd-devel
      - libudev-devel

  - type: containerfile
    snippets:
      - |
        # Block 1: Clone vDS upstream repository (v0.4.0 Upstream Release)
        RUN git clone --depth 1 https://github.com/hurryman2212/vds.git /vds_build_dir

        # Block 2: Compile kernel module targeting the active kernel release
        RUN KERNEL_VERSION=$(rpm -q kernel --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}\n' | head -n 1) && \
            KERNEL_BUILD_DIR="/usr/src/kernels/${KERNEL_VERSION}" && \
            cd /vds_build_dir/module && \
            make KCFLAGS="-w" KERNELRELEASE="${KERNEL_VERSION}" KERNELDIR="${KERNEL_BUILD_DIR}"

        # Block 3: Generate standalone local headers for isolated build context
        RUN mkdir -p /vds_build_dir/include/bluetooth && \
            cat << 'EOF' > /vds_build_dir/include/bluetooth/bluetooth.h
        #ifndef __BLUETOOTH_H
        #define __BLUETOOTH_H
        #include <stdint.h>
        #include <sys/socket.h>
        #include <string.h>
        #include <stdio.h>
        #ifndef AF_BLUETOOTH
        #define AF_BLUETOOTH 31
        #endif
        #ifndef PF_BLUETOOTH
        #define PF_BLUETOOTH AF_BLUETOOTH
        #endif
        #define BTPROTO_L2CAP 0
        typedef struct { uint8_t b[6]; } __attribute__((packed)) bdaddr_t;
        static inline int bacmp(const bdaddr_t *ba1, const bdaddr_t *ba2) { return memcmp(ba1, ba2, 6); }
        static inline void bacpy(bdaddr_t *dst, const bdaddr_t *src) { memcpy(dst, src, 6); }
        static inline uint16_t htobs(uint16_t n) { return n; }
        static inline int ba2str(const bdaddr_t *ba, char *str) { 
            return sprintf(str, "%02x:%02x:%02x:%02x:%02x:%02x", ba->b[5], ba->b[4], ba->b[3], ba->b[2], ba->b[1], ba->b[0]); 
        }
        #endif
        EOF

        RUN cat << 'EOF' > /vds_build_dir/include/bluetooth/l2cap.h
        #ifndef __L2CAP_H
        #define __L2CAP_H
        #include <bluetooth/bluetooth.h>
        #ifdef __cplusplus
        extern "C" {
        #endif
        struct sockaddr_l2 {
        	sa_family_t l2_family;
        	uint16_t l2_psm;
        	bdaddr_t l2_bdaddr;
        	uint16_t l2_cid;
        	uint8_t l2_bdaddr_type;
        };
        #ifdef __cplusplus
        }
        #endif
        #ifdef __cplusplus
        static_assert(sizeof(struct sockaddr_l2) == 14, "KRITISCH: Struktur-Groesse weicht von 14 Byte ab!");
        #else
        _Static_assert(sizeof(struct sockaddr_l2) == 14, "KRITISCH: Struktur-Groesse weicht von 14 Byte ab!");
        #endif
        #endif
        EOF

        # Block 3b: Override package configuration to skip external BlueZ system
        RUN cd /vds_build_dir && \
            sed -i '/pkg_check_modules.*bluez/c\set(bluez_FOUND TRUE)\nset(bluez_INCLUDE_DIRS "/vds_build_dir/include")\nset(bluez_LIBRARIES "")' CMakeLists.txt && \
            sed -i 's/PkgConfig::BLUEZ//g' CMakeLists.txt

        # Block 3c: Bereite v0.4.0 daemon vor und patche Bluetooth-Ports auf Alternativ-Ports um
        RUN cd /vds_build_dir && \
            sed -i '/pkg_check_modules.*bluez/c\set(bluez_FOUND TRUE)\nset(bluez_INCLUDE_DIRS "/vds_build_dir/include")\nset(bluez_LIBRARIES "")' CMakeLists.txt && \
            sed -i 's/PkgConfig::BLUEZ//g' CMakeLists.txt && \
            # --- DER PORT-PATCH ---
            # Wir suchen im Quellcode nach PSM 0x11 (Control) und 0x13 (Interrupt) und biegen sie für vdsd um
            find . -type f -exec sed -i 's/0x11/0x21/g' {} + && \
            find . -type f -exec sed -i 's/0x13/0x23/g' {} + && \
            mkdir -p build

        # Block 4: Initialize PKG_ROOT structure, compile binaries and stage payloads
        # Zuerst holen wir die vds-proxy.c aus deinem Git-Projekt-Root in den Container
        COPY vds-proxy.c /vds_build_dir/vds-proxy.c

        # Jetzt führen wir den Build-Prozess mit der vorhandenen Datei aus
        RUN KERNEL_VERSION=$(rpm -q kernel --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}\n' | head -n 1) && \
            PKG_ROOT="/vds-pkg-root" && \
            mkdir -p "${PKG_ROOT}/usr/lib/modules/${KERNEL_VERSION}/extra" && \
            mkdir -p "${PKG_ROOT}/usr/lib/modules-load.d" && \
            mkdir -p "${PKG_ROOT}/usr/bin" && \
            mkdir -p "${PKG_ROOT}/usr/lib/systemd/system/bluetooth.service.d" && \
            mkdir -p "${PKG_ROOT}/usr/lib/systemd/system" && \
            mkdir -p "${PKG_ROOT}/usr/share/dbus-1/system.d" && \
            mkdir -p "${PKG_ROOT}/usr/lib/udev/rules.d" && \
            mkdir -p "${PKG_ROOT}/usr/share/vdsd" && \
            mkdir -p "${PKG_ROOT}/etc/wireplumber/wireplumber.conf.d" && \
            # 1. Kompiliere den originalen Daemon via CMake
            cd /vds_build_dir/build && \
            cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-isystem /vds_build_dir/include" -DCMAKE_CXX_FLAGS="-isystem /vds_build_dir/include" && \
            make -j$(nproc) && \
            # 2. Kompiliere den Proxy (Die Datei wurde per COPY perfekt platziert!)
            gcc -O2 -Wall -I/vds_build_dir/include /vds_build_dir/vds-proxy.c -o /vds_build_dir/build/vds-proxy && \
            # 3. Kopiere das Kernel-Modul in die Paketstruktur
            cp /vds_build_dir/module/vds_hcd.ko "${PKG_ROOT}/usr/lib/modules/${KERNEL_VERSION}/extra/" && \
            chmod 644 "${PKG_ROOT}/usr/lib/modules/${KERNEL_VERSION}/extra/vds_hcd.ko" && \
            # 4. Kopiere alle drei fertigen Binaries in die Paketstruktur
            cp /vds_build_dir/build/vdsd "${PKG_ROOT}/usr/bin/vdsd" && \
            cp /vds_build_dir/build/vdsctl "${PKG_ROOT}/usr/bin/vdsctl" && \
            cp /vds_build_dir/build/vds-proxy "${PKG_ROOT}/usr/bin/vds-proxy" && \
            chmod 755 "${PKG_ROOT}/usr/bin/vdsd" "${PKG_ROOT}/usr/bin/vdsctl" "${PKG_ROOT}/usr/bin/vds-proxy"

        # Block 5: Deploy monolithic system daemons mit systemd-Verzögerung
        RUN PKG_ROOT="/vds-pkg-root" && \
            printf "vds_hcd\n" > "${PKG_ROOT}/usr/lib/modules-load.d/vds.conf" && \
            \
            # --- 1. PROXY SERVICE (Startet erst, wenn das System im Leerlauf ist) ---
            ( \        
              echo '[Unit]'; \
              echo 'Description=vDS Dynamic Bluetooth Socket Router'; \
              echo 'After=bluetooth.service systemd-udevd.service'; \
              echo 'Requires=bluetooth.service'; \
              echo ''; \
              echo '[Service]'; \
              # Type=idle sorgt dafür, dass die Grafikkarte längst fertig geladen hat
              echo 'Type=idle'; \
              # 5 Sekunden zusätzlicher Puffer, damit BlueZ sich fangen kann
              echo 'ExecStartPre=/usr/bin/sleep 5'; \
              echo 'ExecStart=/usr/bin/vds-proxy'; \
              echo 'Restart=always'; \
              echo 'RestartSec=5'; \
              echo 'User=root'; \
              # Volle Rechte und Capabilities bleiben erhalten
              echo 'CapabilityBoundingSet=CAP_NET_RAW CAP_SYS_ADMIN CAP_NET_ADMIN CAP_NET_BIND_SERVICE'; \
              echo 'AmbientCapabilities=CAP_NET_RAW CAP_SYS_ADMIN CAP_NET_ADMIN CAP_NET_BIND_SERVICE'; \
              echo '# Performance-Priorisierung für latenzfreie Eingaben'; \
              echo 'Nice=-10'; \
            ) > "${PKG_ROOT}/usr/lib/systemd/system/vds-proxy.service" && \
            \
            # --- 2. VDSD DAEMON SERVICE (Startet nach dem Proxy im Leerlauf) ---
            ( \
              echo '[Unit]'; \
              echo 'Description=Virtual DualSense Userspace Daemon'; \
              echo 'After=bluetooth.service vds-proxy.service'; \
              echo 'Requires=bluetooth.service vds-proxy.service'; \
              echo ''; \
              echo '[Service]'; \
              echo 'Type=idle'; \
              echo 'ExecStartPre=/usr/bin/mkdir -p /var/lib/vds'; \
              echo 'ExecStartPre=/usr/bin/chmod 666 /dev/uhid'; \
              # Auch hier ein kurzer Puffer, damit der Proxy sicher auf den Ports lauscht
              echo 'ExecStartPre=/usr/bin/sleep 7'; \
              echo 'ExecStart=/usr/bin/vdsd'; \
              echo 'Restart=always'; \
              echo 'RestartSec=5'; \
              echo 'User=root'; \
              echo 'ProtectSystem=false'; \
              echo 'ProtectHome=false'; \
              echo 'PrivateTmp=no'; \
              echo 'PrivateDevices=no'; \
              echo 'PrivateNetwork=no'; \
              echo 'CapabilityBoundingSet=CAP_NET_RAW CAP_SYS_ADMIN CAP_NET_ADMIN CAP_NET_BIND_SERVICE CAP_SYS_RAWIO'; \
              echo 'AmbientCapabilities=CAP_NET_RAW CAP_SYS_ADMIN CAP_NET_ADMIN CAP_NET_BIND_SERVICE CAP_SYS_RAWIO'; \
              echo 'Nice=-10'; \
            ) > "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service"
            
        # Block 6: Apply BlueZ compat configuration and optimized database udev triggers
        RUN PKG_ROOT="/vds-pkg-root" && \
               printf "[Unit]\nDescription=Setze Berechtigungen für vDS SDP-Socket wenn er erscheint\n\n[Service]\nType=oneshot\nExecStart=/usr/bin/chmod 0777 /run/sdp\nRemainAfterExit=yes\n" > "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.service" && \
               printf "[Unit]\nDescription=Überwache BlueZ SDP-Socket für vDS\n\n[Path]\nPathChanged=/run/sdp\nUnit=vds-chmod-sdp.service\n\n[Install]\nWantedBy=multi-user.target\n" > "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.path" && \
               printf "[Service]\nExecStart=\nExecStart=/usr/libexec/bluetooth/bluetoothd --compat\n" > "${PKG_ROOT}/usr/lib/systemd/system/bluetooth.service.d/override.conf" && \
               printf "[General]\nClassicBondedOnly=false\n" > "${PKG_ROOT}/usr/share/vdsd/main.conf" && \
               printf "<!DOCTYPE busconfig PUBLIC \"-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN\"\n \"http://freedesktop.org\">\n<busconfig>\n  <policy user=\"root\">\n    <allow own=\"org.vds\"/>\n    <allow send_destination=\"org.vds\"/>\n  </policy>\n  <policy context=\"default\">\n    <allow send_destination=\"org.vds\"/>\n  </policy>\n</busconfig>\n" > "${PKG_ROOT}/usr/share/dbus-1/system.d/org.vds.conf" && \
               ( \
                 echo '# Filtert unbestechlich auf das Hauptgerät im input-Subsystem'; \
                 echo 'SUBSYSTEM!="input", GOTO="vds_end"'; \
                 echo 'KERNEL!="event*", GOTO="vds_end"'; \
                 echo 'ATTR{name}!="DualSense Wireless Controller", GOTO="vds_end"'; \
                 echo ''; \
                 echo '# Reagiert exklusiv beim Hinzufügen (Erst-Connect)'; \
                 echo 'ACTION!="add", GOTO="vds_end"'; \
                 echo ''; \
                 echo '# Datenbank-Injektion: Nutzt das unbestechliche Kernel-Attribut statt env'; \
                 echo 'RUN+="/usr/bin/vdsctl attach \$attr{properties/uniq}"'; \
                 echo ''; \
                 echo 'LABEL="vds_end"'; \
               ) > "${PKG_ROOT}/usr/lib/udev/rules.d/99-vds-dualsense-udev.rules" && \
               printf 'KERNEL=="uinput", MODE="0660", GROUP="input", OPTIONS+="static_node=uinput"\n' > "${PKG_ROOT}/usr/lib/udev/rules.d/99-vds-uinput.rules" && \
               printf 'KERNEL=="vds[0-9]*", MODE="0660", GROUP="input", TAG+="systemd"\n' >> "${PKG_ROOT}/usr/lib/udev/rules.d/99-vds-uinput.rules"

        # Block 6b: Configure native WirePlumber quadraphonic audio and masking rules
        RUN KERNEL_VERSION=$(rpm -q kernel --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}\n' | head -n 1) && \
            PKG_ROOT="/vds-pkg-root" && \
            mkdir -p "${PKG_ROOT}/usr/share/wireplumber/wireplumber.conf.d" && \
            ( \
              echo 'monitor.alsa.rules = ['; \
              echo '  {'; \
              echo '    # REGEL 1: vDS-GERAET MASKIEREN (WILD-CARD MATCH)'; \
              echo '    matches = ['; \
              echo '      {'; \
              echo '        "node.name" = "~alsa_output.usb-Sony_Interactive_Entertainment.*"'; \
              echo '      }'; \
              echo '    ]'; \
              echo '    actions = {'; \
              echo '      update-props = {'; \
              echo '        "alsa.card_id"        = "WirelessController"'; \
              echo '        "alsa.card_name"      = "WirelessController"'; \
              echo '        "device.nick"         = "WirelessController"'; \
              echo '        "node.name"           = "alsa_output.usb-Sony_Interactive_Entertainment_WirelessController-00.pro-audio"'; \
              echo '        "node.description"    = "WirelessController"'; \
              echo '        "node.nick"           = "WirelessController"'; \
              echo '        "api.alsa.use-acp"    = false'; \
              echo '        "audio.channels"      = 4'; \
              echo '        "audio.position"      = [ "FL", "FR", "RL", "RR" ]'; \
              echo '        "priority.driver"     = 1500'; \
              echo '        "priority.session"    = 1500'; \
              echo '        "session.suspend-on-idle" = false'; \
              echo '      }'; \
              echo '    }'; \
              echo '  },'; \
              echo '  {'; \
              echo '    # REGEL 2: REALE BLUETOOTH-KARTE DEAKTIVIEREN'; \
              echo '    matches = ['; \
              echo '      {'; \
              echo '        "node.name" = "~alsa_output.pci.*DualSense.*"'; \
              echo '      },'; \
              echo '      {'; \
              echo '        "node.name" = "~alsa_input.pci.*DualSense.*"'; \
              echo '      },'; \
              echo '      {'; \
              echo '        "node.description" = "~.*DualSense wireless controller.*"'; \
              echo '      }'; \
              echo '    ]'; \
              echo '    actions = {'; \
              echo '      update-props = {'; \
              echo '        "device.disabled" = true'; \
              echo '        "node.disabled"   = true'; \
              echo '      }'; \
              echo '    }'; \
              echo '  }'; \
              echo ']'; \
            ) > "${PKG_ROOT}/usr/share/wireplumber/wireplumber.conf.d/99-vds-prioritisation.conf"

        # Block 7: Generate isolated RPM package via rpmbuild without system locks
        RUN mkdir -p /root/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS} && \
            ( \
              echo 'Name: kmod-vds'; \
              echo 'Version: 1.0.0'; \
              echo 'Release: 1'; \
              echo 'Summary: Virtual DualSense Driver'; \
              echo 'License: MIT'; \
              echo ''; \
              echo '%description'; \
              echo 'Virtual DualSense Driver und Daemon fuer Bazzite mit nativem C-Code-Spoofing und WirePlumber-Priorisierung.'; \
              echo ''; \
              echo '%post'; \
              echo 'mkdir -p /etc/bluetooth'; \
              echo 'cp -n /usr/share/vdsd/main.conf /etc/bluetooth/main.conf 2>/dev/null || true'; \
              echo '# Kernel-Abhängigkeiten zur Bootzeit absichern'; \
              echo 'KERNEL_VERSION=$(rpm -q kernel --queryformat "%%{VERSION}-%%{RELEASE}.%%{ARCH}\n" | head -n 1)'; \
              echo 'depmod -a "${KERNEL_VERSION}" 2>/dev/null || true'; \
              echo 'exit 0'; \
              echo ''; \
              echo '%files'; \
              echo '/usr/lib/modules/'$(rpm -q kernel --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}\n' | head -n 1)'/extra/vds_hcd.ko'; \
              echo '/usr/lib/modules-load.d/vds.conf'; \
              echo '/usr/bin/vdsd'; \
              echo '/usr/bin/vdsctl'; \
              echo '/usr/bin/vds-proxy'; \
              echo '/usr/lib/systemd/system/vdsd.service'; \
              echo '/usr/lib/systemd/system/vds-proxy.service'; \
              echo '/usr/lib/systemd/system/vds-chmod-sdp.service'; \
              echo '/usr/lib/systemd/system/vds-chmod-sdp.path'; \
              echo '/usr/share/dbus-1/system.d/org.vds.conf'; \
              echo '/usr/lib/udev/rules.d/99-vds-uinput.rules'; \
              echo '/usr/lib/udev/rules.d/99-vds-dualsense-udev.rules'; \
              echo '/usr/share/wireplumber/wireplumber.conf.d/99-vds-prioritisation.conf'; \
              echo '/usr/lib/systemd/system/bluetooth.service.d/override.conf'; \
              echo '/usr/share/vdsd/main.conf'; \
            ) > /root/rpmbuild/SPECS/vds.spec && \
            rpmbuild --define "_topdir /root/rpmbuild" --buildroot=/vds-pkg-root -bb /root/rpmbuild/SPECS/vds.spec && \
            mkdir -p /tmp/vds-rpm && \
            cp /root/rpmbuild/RPMS/x86_64/kmod-vds-1.0.0-1.x86_64.rpm /tmp/vds-rpm/

        # Block 8: Extract localized RPM payload directly into the image root
        # Da wir uns im nativen Container-Build befinden, extrahieren wir die Dateien direkt dorthin, wo sie hingehören
        RUN rpm2cpio /tmp/vds-rpm/kmod-vds-1.0.0-1.x86_64.rpm | cpio -idmv -D /

        # Block 9 & 10: Aktivierung über Standard-Targets mit Leerlauf-Verzögerung
        RUN mkdir -p /usr/lib/systemd/system/multi-user.target.wants && \
            ln -sf /usr/lib/systemd/system/vds-proxy.service /usr/lib/systemd/system/multi-user.target.wants/vds-proxy.service && \
            ln -sf /usr/lib/systemd/system/vdsd.service /usr/lib/systemd/system/multi-user.target.wants/vdsd.service && \
            rm -rf /vds_build_dir /vds-pkg-root /root/rpmbuild /tmp/vds-rpm

        # Block 10: Purge temporary build contexts, compilation paths, and runtime caches
        RUN rm -rf /vds_build_dir /vds-pkg-root /root/rpmbuild /tmp/vds-rpm
