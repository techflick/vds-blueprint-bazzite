# yaml-language-server: $schema=https://blue-build.org
name: mein-bazzite-vds
description: Mein persönliches Bazzite mit nativer Integration des vDS Treibers und Daemons ohne Distrobox.

base-image: ghcr.io/ublue-os/bazzite
image-version: latest

modules:
  - type: rpm-ostree
    install:
      - kernel-devel
      - make
      - gcc
      - gcc-c++
      - cmake
      - git
      - ruby-devel
      - rubygems
      - rpm-build

  - type: script
    snippets:
      - |
        set -e

        echo "=== 1. Vorbereitungen für Paketierung ==="
        gem install --no-document fpm
        
        echo "=== 2. Quellcode holen ==="
        rm -rf /tmp/vds_source
        git clone https://github.com/hurryman2212/vds.git /tmp/vds_source
        
        KERNEL_VERSION=$(ls -1 /usr/src/kernels/ | head -n 1)
        if [ -z "${KERNEL_VERSION}" ]; then
          echo "FEHLER: Keine Kernel-Header in /usr/src/kernels/ gefunden!"
          exit 1
        fi
        echo "Ziel-Kernel für die Kompilierung: ${KERNEL_VERSION}"
        
        RPM_ITERATION=$(echo "${KERNEL_VERSION}" | tr "-" "_")
        KERNEL_BUILD_DIR="/usr/src/kernels/${KERNEL_VERSION}"
        
        echo "=== 2b. Minimale BlueZ-Schnittstellen lokal erstellen ==="
        mkdir -p /usr/include/bluetooth

        # bluetooth.h
        echo "#ifndef __BLUETOOTH_H" > /usr/include/bluetooth/bluetooth.h
        echo "#define __BLUETOOTH_H" >> /usr/include/bluetooth/bluetooth.h
        echo "#include <stdint.h>" >> /usr/include/bluetooth/bluetooth.h
        echo "typedef struct { uint8_t b; } __attribute__((packed)) bdaddr_t;" >> /usr/include/bluetooth/bluetooth.h
        echo "#define AF_BLUETOOTH 31" >> /usr/include/bluetooth/bluetooth.h
        echo "#define PF_BLUETOOTH AF_BLUETOOTH" >> /usr/include/bluetooth/bluetooth.h
        echo "#define BTPROTO_L2CAP 0" >> /usr/include/bluetooth/bluetooth.h
        echo "#endif" >> /usr/include/bluetooth/bluetooth.h

        # hci.h
        echo "#ifndef __HCI_H" > /usr/include/bluetooth/hci.h
        echo "#define __HCI_H" >> /usr/include/bluetooth/hci.h
        echo "#include <bluetooth/bluetooth.h>" >> /usr/include/bluetooth/hci.h
        echo "#endif" >> /usr/include/bluetooth/hci.h

        # l2cap.h
        echo "#ifndef __L2CAP_H" > /usr/include/bluetooth/l2cap.h
        echo "#define __L2CAP_H" >> /usr/include/bluetooth/l2cap.h
        echo "#include <bluetooth/bluetooth.h>" >> /usr/include/bluetooth/l2cap.h
        echo "struct sockaddr_l2 {" >> /usr/include/bluetooth/l2cap.h
        echo "    sa_family_t l2_family;" >> /usr/include/bluetooth/l2cap.h
        echo "    uint16_t    l2_psm;" >> /usr/include/bluetooth/l2cap.h
        echo "    bdaddr_t    l2_bdaddr;" >> /usr/include/bluetooth/l2cap.h
        echo "    uint16_t    l2_cid;" >> /usr/include/bluetooth/l2cap.h
        echo "    uint8_t     l2_bdaddr_type;" >> /usr/include/bluetooth/l2cap.h
        echo "};" >> /usr/include/bluetooth/l2cap.h
        echo "#endif" >> /usr/include/bluetooth/l2cap.h

        echo "=== 3. Native Kompilierung ==="
        # 3a. Kernel-Modul bauen
        cd /tmp/vds_source/module
        make KCFLAGS="-w" KERNELRELEASE="${KERNEL_VERSION}" KERNELDIR="${KERNEL_BUILD_DIR}"
        
        # 3b. Userspace-Daemon via CMake bauen
        cd /tmp/vds_source
        
        # DEFINITIVER FIX: Wir rasieren zeilenbasierte Abfragen direkt per sed anhand Mustern ab
        # Wir ersetzen jegliche pkg_check_modules Zeile, die bluez enthält, durch einen statischen Erfolg
        sed -i '/pkg_check_modules.*bluez/c\set(bluez_FOUND TRUE)' CMakeLists.txt
        
        mkdir -p build
        cd build
        cmake .. -DCMAKE_BUILD_TYPE=Release
        make
        
        echo "=== 4. Installations-Struktur simulieren ==="
        PKG_ROOT="/tmp/vds-pkg-root"
        mkdir -p "${PKG_ROOT}/usr/lib/modules/${KERNEL_VERSION}/extra"
        mkdir -p "${PKG_ROOT}/usr/lib/modules-load.d"
        mkdir -p "${PKG_ROOT}/usr/bin"
        mkdir -p "${PKG_ROOT}/usr/lib/systemd/system/bluetooth.service.d"
        mkdir -p "${PKG_ROOT}/usr/lib/systemd/system"
        
        # Dateien kopieren (Modul & neue Binaries)
        cp /tmp/vds_source/module/vds_hcd.ko "${PKG_ROOT}/usr/lib/modules/${KERNEL_VERSION}/extra/"
        chmod 644 "${PKG_ROOT}/usr/lib/modules/${KERNEL_VERSION}/extra/vds_hcd.ko"
        
        cp /tmp/vds_source/build/src/vdsd "${PKG_ROOT}/usr/bin/vdsd"
        cp /tmp/vds_source/build/src/vdsctl "${PKG_ROOT}/usr/bin/vdsctl"
        chmod 755 "${PKG_ROOT}/usr/bin/vdsd" "${PKG_ROOT}/usr/bin/vdsctl"
        
        echo "vds_hcd" > "${PKG_ROOT}/usr/lib/modules-load.d/vds.conf"
        
        # Bluetooth Service-Override für den SDP-Socket (--compat)
        echo "[Service]" > "${PKG_ROOT}/usr/lib/systemd/system/bluetooth.service.d/override.conf"
        echo "ExecStart=" >> "${PKG_ROOT}/usr/lib/systemd/system/bluetooth.service.d/override.conf"
        echo "ExecStart=/usr/libexec/bluetooth/bluetoothd --compat --noplugin=input" >> "${PKG_ROOT}/usr/lib/systemd/system/bluetooth.service.d/override.conf"

        # Systemd-Service für den vDS Daemon
        echo "[Unit]" > "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service"
        echo "Description=Virtual DualSense Userspace Daemon" >> "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service"
        echo "After=bluetooth.service" >> "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service"
        echo "Requires=bluetooth.service" >> "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service"
        echo "" >> "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service"
        echo "[Service]" >> "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service"
        echo "Type=simple" >> "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service"
        echo "ExecStart=/usr/bin/vdsd" >> "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service"
        echo "Restart=always" >> "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service"
        echo "RestartSec=3" >> "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service"
        echo "" >> "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service"
        echo "[Install]" >> "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service"
        echo "WantedBy=multi-user.target" >> "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service"

        # Systemd-Service für chmod auf /run/sdp
        echo "[Unit]" > "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.service"
        echo "Description=Setze Berechtigungen für vDS SDP-Socket" >> "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.service"
        echo "After=bluetooth.service" >> "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.service"
        echo "" >> "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.service"
        echo "[Service]" >> "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.service"
        echo "Type=oneshot" >> "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.service"
        echo "ExecStart=/usr/bin/chmod 0777 /run/sdp" >> "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.service"

        # Systemd-Path-Unit zur Überwachung von /run/sdp
        echo "[Unit]" > "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.path"
        echo "Description=Überwache vDS SDP-Socket Existenz" >> "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.path"
        echo "" >> "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.path"
        echo "[Path]" >> "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.path"
        echo "PathChanged=/run/sdp" >> "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.path"
        echo "" >> "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.path"
        echo "[Install]" >> "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.path"
        echo "WantedBy=multi-user.target" >> "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.path"

        echo "=== 5. Echtes RPM Paket generieren ==="
        cd /tmp
        fpm -s dir -t rpm \
          -n "kmod-vds" \
          -v "1.0.0" \
          --iteration "${RPM_ITERATION}" \
          -C "${PKG_ROOT}" \
          usr/lib/modules usr/lib/modules-load.d usr/bin usr/lib/systemd
          
        echo "=== 6. Das generierte Paket installieren ==="
        rpm -ivh kmod-vds-1.0.0-*.rpm
        
        echo "=== 6b. Kernel-Modul-Index aktualisieren ==="
        depmod -a "${KERNEL_VERSION}"
        
        echo "=== 7. Bereinigung ==="
        rm -rf /tmp/vds_source /tmp/vds-pkg-root /tmp/kmod-vds-*.rpm
        echo "=== Build erfolgreich abgeschlossen! ==="
