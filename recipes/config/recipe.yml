# yaml-language-server: $schema=https://blue-build.org
name: mein-bazzite-vds
description: "Mein persönliches Bazzite mit nativer Integration des vDS Treibers und Daemons (v0.4.0) ohne Distrobox."

base-image: ghcr.io/ublue-os/bazzite
image-version: latest

modules:
  - type: rpm-ostree
    install:
      - kernel-devel
      - make
      - gcc
      - gcc-c++
      - cmake
      - git
      - dbus-devel
      - opus-devel
      - rpm-build
      - systemd-devel
      - libudev-devel

  - type: containerfile
    snippets:
      - |
        # Block 1: vDS-Repository frisch klonen (Version 0.4.0)
        RUN git clone --depth 1 https://github.com /vds_build_dir

        # Block 2: Kernel-Modul für die aktive Bazzite-Kernelversion bauen
        RUN KERNEL_VERSION=$(rpm -q kernel --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}\n' | head -n 1) && \
            KERNEL_BUILD_DIR="/usr/src/kernels/${KERNEL_VERSION}" && \
            cd /vds_build_dir/module && \
            make KCFLAGS="-w" KERNELRELEASE="${KERNEL_VERSION}" KERNELDIR="${KERNEL_BUILD_DIR}"
            
        # Block 3: Lokale Header erzeugen (Ihr Original-Fix gegen den Bazzite/BlueZ-Paketkonflikt)
        RUN mkdir -p /vds_build_dir/include/bluetooth && \
            cat << 'EOF' > /vds_build_dir/include/bluetooth/bluetooth.h
        #ifndef __BLUETOOTH_H
        #define __BLUETOOTH_H
        #include <stdint.h>
        #include <sys/socket.h>
        #include <string.h>
        #include <stdio.h>
        #ifndef AF_BLUETOOTH
        #define AF_BLUETOOTH 31
        #endif
        #ifndef PF_BLUETOOTH
        #define PF_BLUETOOTH AF_BLUETOOTH
        #endif
        #define BTPROTO_L2CAP 0
        typedef struct { uint8_t b[6]; } __attribute__((packed)) bdaddr_t;
        static inline int bacmp(const bdaddr_t *ba1, const bdaddr_t *ba2) { return memcmp(ba1, ba2, 6); }
        static inline void bacpy(bdaddr_t *dst, const bdaddr_t *src) { memcpy(dst, src, 6); }
        static inline uint16_t htobs(uint16_t n) { return n; }
        static inline int ba2str(const bdaddr_t *ba, char *str) { 
            return sprintf(str, "%02x:%02x:%02x:%02x:%02x:%02x", ba->b[5], ba->b[4], ba->b[3], ba->b[2], ba->b[1], ba->b[0]); 
        }
        #endif
        EOF

        RUN cat << 'EOF' > /vds_build_dir/include/bluetooth/l2cap.h
        #ifndef __L2CAP_H
        #define __L2CAP_H
        #include <bluetooth/bluetooth.h>
        #ifdef __cplusplus
        extern "C" {
        #endif
        struct sockaddr_l2 {
        	sa_family_t l2_family;
        	uint16_t l2_psm;
        	bdaddr_t l2_bdaddr;
        	uint16_t l2_cid;
        	uint8_t l2_bdaddr_type;
        };
        #ifdef __cplusplus
        }
        #endif
        #ifdef __cplusplus
        static_assert(sizeof(struct sockaddr_l2) == 14, "KRITISCH: Struktur-Groesse weicht von 14 Byte ab!");
        #else
        _Static_assert(sizeof(struct sockaddr_l2) == 14, "KRITISCH: Struktur-Groesse weicht von 14 Byte ab!");
        #endif
        #endif
        EOF

        # Block 4: CMake zwingen, die lokalen Header zu fressen und die pkg-config Suche zu überspringen
        RUN cd /vds_build_dir && \
            sed -i '/pkg_check_modules.*bluez/c\set(bluez_FOUND TRUE)\nset(bluez_INCLUDE_DIRS "/vds_build_dir/include")\nset(bluez_LIBRARIES "")' CMakeLists.txt && \
            sed -i 's/PkgConfig::BLUEZ//g' CMakeLists.txt

        # Block 3: Lokale Header erzeugen (Exakte 1:1 Kopie des funktionierenden Original-Rezepts)
        RUN mkdir -p /vds_build_dir/include/bluetooth && \
            cat << 'EOF' > /vds_build_dir/include/bluetooth/bluetooth.h
        #ifndef __BLUETOOTH_H
        #define __BLUETOOTH_H
        #include <stdint.h>
        #include <sys/socket.h>
        #include <string.h>
        #include <stdio.h>
        #ifndef AF_BLUETOOTH
        #define AF_BLUETOOTH 31
        #endif
        #ifndef PF_BLUETOOTH
        #define PF_BLUETOOTH AF_BLUETOOTH
        #endif
        #define BTPROTO_L2CAP 0
        typedef struct { uint8_t b[6]; } __attribute__((packed)) bdaddr_t;
        static inline int bacmp(const bdaddr_t *ba1, const bdaddr_t *ba2) { return memcmp(ba1, ba2, 6); }
        static inline void bacpy(bdaddr_t *dst, const bdaddr_t *src) { memcpy(dst, src, 6); }
        static inline uint16_t htobs(uint16_t n) { return n; }
        static inline int ba2str(const bdaddr_t *ba, char *str) { 
            return sprintf(str, "%02x:%02x:%02x:%02x:%02x:%02x", ba->b[5], ba->b[4], ba->b[3], ba->b[2], ba->b[1], ba->b[0]); 
        }
        #endif
        EOF

        RUN cat << 'EOF' > /vds_build_dir/include/bluetooth/l2cap.h
        #ifndef __L2CAP_H
        #define __L2CAP_H
        #include <bluetooth/bluetooth.h>
        #ifdef __cplusplus
        extern "C" {
        #endif
        struct sockaddr_l2 {
        	sa_family_t l2_family;
        	uint16_t l2_psm;
        	bdaddr_t l2_bdaddr;
        	uint16_t l2_cid;
        	uint8_t l2_bdaddr_type;
        };
        #ifdef __cplusplus
        }
        #endif
        #ifdef __cplusplus
        static_assert(sizeof(struct sockaddr_l2) == 14, "KRITISCH: Struktur-Groesse weicht von 14 Byte ab!");
        #else
        _Static_assert(sizeof(struct sockaddr_l2) == 14, "KRITISCH: Struktur-Groesse weicht von 14 Byte ab!");
        #endif
        #endif
        EOF

        # Block 6: SDP-Berechtigungshelfer, D-Bus-Policy und Hardware-Weichen generieren
        RUN PKG_ROOT="/vds-pkg-root" && \
            printf "[Unit]\nDescription=Setze Berechtigungen für vDS SDP-Socket wenn er erscheint\n\n[Service]\nType=oneshot\nExecStart=/usr/bin/chmod 0777 /run/sdp\nRemainAfterExit=yes\n" > "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.service" && \
            printf "[Unit]\nDescription=Überwache BlueZ SDP-Socket für vDS\n\n[Path]\nPathChanged=/run/sdp\nUnit=vds-chmod-sdp.service\n\n[Install]\nWantedBy=multi-user.target\n" > "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.path" && \
            printf "<!DOCTYPE busconfig PUBLIC \"-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN\"\n \"http://freedesktop.org\">\n<busconfig>\n  <policy user=\"root\">\n    <allow own=\"org.vds\"/>\n    <allow send_destination=\"org.vds\"/>\n  </policy>\n  <policy context=\"default\">\n    <allow send_destination=\"org.vds\"/>\n  </policy>\n</busconfig>\n" > "${PKG_ROOT}/usr/share/dbus-1/system.d/org.vds.conf" && \
            ( \
              echo 'SUBSYSTEM=="hid", ATTRS{modalias}=="hid:b0005g*v0000054Cp00000CE6*", ATTR{driver_override}="dummy"'; \
              echo 'SUBSYSTEM=="hid", ATTRS{modalias}=="hid:b0005g*v0000054Cp00000DF2*", ATTR{driver_override}="dummy"'; \
              echo 'KERNEL=="hidraw*", ATTRS{modalias}=="hid:b0005g*v0000054Cp00000CE6*", MODE="0660", TAG+="uaccess"'; \
              echo 'KERNEL=="hidraw*", ATTRS{modalias}=="hid:b0005g*v0000054Cp00000DF2*", MODE="0660", TAG+="uaccess"'; \
            ) > "${PKG_ROOT}/usr/lib/udev/rules.d/99-vds-dualsense-udev.rules" && \
            printf 'KERNEL=="uinput", MODE="0660", GROUP="input", SECLABEL{selinux}="system_u:object_r:input_device_t:s0", OPTIONS+="static_node=uinput"\n' > "${PKG_ROOT}/usr/lib/udev/rules.d/99-vds-uinput.rules" && \
            printf 'KERNEL=="vds[0-9]*", MODE="0660", GROUP="input", SECLABEL{selinux}="system_u:object_r:input_device_t:s0"\n' >> "${PKG_ROOT}/usr/lib/udev/rules.d/99-vds-uinput.rules"
        
        # Block 7: Natives RPM via rpmbuild paketieren und direkt im OCI-Image installieren
        RUN KERNEL_VERSION=$(rpm -q kernel --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}\n' | head -n 1) && \
            mkdir -p /root/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS} && \
            echo "Name: kmod-vds" > /root/rpmbuild/SPECS/vds.spec && \
            echo "Version: 1.0.0" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "Release: 1" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "Summary: Virtual DualSense Driver" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "License: MIT" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "%description" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "Virtual DualSense Driver und Daemon für Bazzite." >> /root/rpmbuild/SPECS/vds.spec && \
            echo "%post" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/sbin/restorecon -R /usr/bin/vdsd /usr/bin/vdsctl /usr/lib/systemd/system/vdsd.service /usr/etc/bluetooth /usr/lib/udev/rules.d/99-vds-*.rules /var/lib/vdsd 2>/dev/null || true" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/bin/udevadm control --reload-rules 2>/dev/null || true" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/bin/udevadm trigger --action=change 2>/dev/null || true" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/bin/systemctl daemon-reload 2>/dev/null || true" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/bin/systemctl preset vdsd.service 2>/dev/null || true" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/bin/systemctl enable vdsd.service 2>/dev/null || true" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/bin/systemctl preset vds-chmod-sdp.path 2>/dev/null || true" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/bin/systemctl enable vds-chmod-sdp.path 2>/dev/null || true" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "%files" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/lib/modules/${KERNEL_VERSION}/extra/vds_hcd.ko" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/lib/modules-load.d/vds.conf" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/bin/vdsd" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/bin/vdsctl" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "%dir /usr/lib/systemd/system/bluetooth.service.d" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/lib/systemd/system/bluetooth.service.d/override.conf" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "%dir /usr/etc/bluetooth" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/etc/bluetooth/main.conf" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/lib/systemd/system/vdsd.service" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/lib/systemd/system/vds-chmod-sdp.service" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/lib/systemd/system/vds-chmod-sdp.path" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/share/dbus-1/system.d/org.vds.conf" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/lib/udev/rules.d/99-vds-dualsense-udev.rules" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/lib/udev/rules.d/99-vds-uinput.rules" >> /root/rpmbuild/SPECS/vds.spec && \
            rpmbuild --define "_topdir /root/rpmbuild" --buildroot=/vds-pkg-root -bb /root/rpmbuild/SPECS/vds.spec && \
            rpm -ivh --nodeps /root/rpmbuild/RPMS/x86_64/kmod-vds-1.0.0-1.x86_64.rpm

        # Block 8: Kernel-Abhängigkeiten neu indizieren (Für automatisches Laden von vds_hcd.ko)
        RUN KERNEL_VERSION=$(rpm -q kernel --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}\n' | head -n 1) && \
            depmod -a -b / "${KERNEL_VERSION}"

        # Block 9: Unwiderrufliche Fixierung der Systemd-Infrastruktur via Service-Override (Schritt 7)
        RUN mkdir -p /etc/systemd/system/vdsd.service.d && \
            ( \
              echo '[Service]'; \
              echo 'PrivateNetwork=no'; \
              echo 'PrivateDevices=no'; \
              echo 'NoNewPrivileges=no'; \
              echo 'RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_BLUETOOTH AF_NETLINK'; \
              echo 'DeviceAllow=/dev/uinput rw'; \
            ) > /etc/systemd/system/vdsd.service.d/override.conf

        # Block 10: Temporäre Build-Verzeichnisse rückstandslos entfernen
        RUN rm -rf /vds_build_dir /vds-pkg-root /root/rpmbuild
