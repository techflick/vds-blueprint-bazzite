# GitHub Bauplan für ein angepasstes Bazzite mit vDS
name: mein-bazzite-vds
description: Mein persönliches Bazzite mit integriertem vDS (virtual DualSense) Treiber.

base-image: ghcr.io/ublue-os/bazzite
image-version: latest

modules:
  # 1. Hier installieren wir die Build-Werkzeuge sauber über das korrekte BlueBuild-Modul
  - type: rpm-ostree
    install:
      - git
      - cmake
      - gcc-c++
      - opus-devel
      - libudev-devel
      - dbus-devel
      - bluez-libs-devel
      - kernel-devel

  # 2. Hier läuft das eigentliche Kompilieren ohne Paket-Installationen
  - type: script
    snippets:
      - |
        echo "=== 1. Klone das vDS-Repository ==="
        git clone https://github.com /tmp/vds_source
        cd /tmp/vds_source

        echo "=== 2. Kompiliere das Kernel-Modul ==="
        cd module
        make
        # Wir kopieren das Modul in ein beschreibbares Update-Verzeichnis von Ostree
        KERNEL_VER=$(rpm -q kernel --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}\n' | head -n 1)
        mkdir -p /var/lib/modules/${KERNEL_VER}/extra/
        cp vds_hcd.ko /var/lib/modules/${KERNEL_VER}/extra/
        
        echo "=== 3. Kompiliere das Steuerprogramm ==="
        cd /tmp/vds_source
        cmake . -B build
        make -C build
        # Userspace-Programme gehören bei Ostree nach /usr/local/bin
        mkdir -p /usr/local/bin
        cp build/vdsd /usr/local/bin/vdsd
        cp build/vdsctl /usr/local/bin/vdsctl

        echo "=== 4. Bluetooth-Anpassung aktivieren ==="
        chmod +x override-bluetoothd.sh
        ./override-bluetoothd.sh disable-input
