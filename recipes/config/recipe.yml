# yaml-language-server: $schema=https://blue-build.org
name: mein-bazzite-vds
description: "Mein persönliches Bazzite mit nativer Integration des vDS Treibers und Daemons ohne Distrobox."

base-image: ghcr.io/ublue-os/bazzite
image-version: latest

modules:
  - type: rpm-ostree
    install:
      - kernel-devel
      - make
      - gcc
      - gcc-c++
      - cmake
      - git
      - dbus-devel
      - opus-devel
      - rpm-build

  - type: containerfile
    snippets:
      - |
        # 1. vDS-Repository frisch klonen
        RUN git clone --depth 1 https://github.com/hurryman2212/vds.git /vds_build_dir

        # 2. Kernel-Modul kompilieren
        RUN KERNEL_VERSION=$(rpm -q kernel --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}\n' | head -n 1) && \
            KERNEL_BUILD_DIR="/usr/src/kernels/${KERNEL_VERSION}" && \
            cd /vds_build_dir/module && \
            make KCFLAGS="-w" KERNELRELEASE="${KERNEL_VERSION}" KERNELDIR="${KERNEL_BUILD_DIR}"
            
        # 3. Lokale, valide Userspace-Header im Projekt erzeugen & Code programmatisch patchen
        RUN "mkdir -p /vds_build_dir/include/bluetooth && \
            echo '#ifndef __BLUETOOTH_H' > /vds_build_dir/include/bluetooth/bluetooth.h && \
            echo '#define __BLUETOOTH_H' >> /vds_build_dir/include/bluetooth/bluetooth.h && \
            echo '#include <stdint.h>' >> /vds_build_dir/include/bluetooth/bluetooth.h && \
            echo '#include <sys/socket.h>' >> /vds_build_dir/include/bluetooth/bluetooth.h && \
            echo '#include <string.h>' >> /vds_build_dir/include/bluetooth/bluetooth.h && \
            echo '#include <stdio.h>' >> /vds_build_dir/include/bluetooth/bluetooth.h && \
            echo '#define AF_BLUETOOTH 31' >> /vds_build_dir/include/bluetooth/bluetooth.h && \
            echo '#define PF_BLUETOOTH AF_BLUETOOTH' >> /vds_build_dir/include/bluetooth/bluetooth.h && \
            echo '#define BTPROTO_L2CAP 0' >> /vds_build_dir/include/bluetooth/bluetooth.h && \
            echo 'typedef struct { uint8_t b\\[6\\]; } __attribute__((packed)) bdaddr_t;' >> /vds_build_dir/include/bluetooth/bluetooth.h && \
            echo 'static inline int bacmp(const bdaddr_t *ba1, const bdaddr_t *ba2) { return memcmp(ba1, ba2, 6); }' >> /vds_build_dir/include/bluetooth/bluetooth.h && \
            echo 'static inline void bacpy(bdaddr_t *dst, const bdaddr_t *src) { memcpy(dst, src, 6); }' >> /vds_build_dir/include/bluetooth/bluetooth.h && \
            echo 'static inline uint16_t htobs(uint16_t n) { return __builtin_bswap16(n); }' >> /vds_build_dir/include/bluetooth/bluetooth.h && \
            echo 'static inline int ba2str(const bdaddr_t *ba, char *str) { return sprintf(str, \"%%02X:%%02X:%%02X:%%02X:%%02X:%%02X\", ba->b\\[0\\], ba->b\\[1\\], ba->b\\[2\\], ba->b\\[3\\], ba->b\\[4\\], ba->b\\[5\\]); }' >> /vds_build_dir/include/bluetooth/bluetooth.h && \
            echo '#endif' >> /vds_build_dir/include/bluetooth/bluetooth.h && \
            echo '#ifndef __L2CAP_H' > /vds_build_dir/include/bluetooth/l2cap.h && \
            echo '#define __L2CAP_H' >> /vds_build_dir/include/bluetooth/l2cap.h && \
            echo '#include <bluetooth/bluetooth.h>' >> /vds_build_dir/include/bluetooth/l2cap.h && \
            echo 'struct sockaddr_l2 {' >> /vds_build_dir/include/bluetooth/l2cap.h && \
            echo '    sa_family_t l2_family;' >> /vds_build_dir/include/bluetooth/l2cap.h && \
            echo '    uint16_t l2_psm;' >> /vds_build_dir/include/bluetooth/l2cap.h && \
            echo '    bdaddr_t l2_bdaddr;' >> /vds_build_dir/include/bluetooth/l2cap.h && \
            echo '    uint16_t l2_cid;' >> /vds_build_dir/include/bluetooth/l2cap.h && \
            echo '    uint8_t l2_bdaddr_type;' >> /vds_build_dir/include/bluetooth/l2cap.h && \
            echo '} __attribute__((packed));' >> /vds_build_dir/include/bluetooth/l2cap.h && \
            echo '#endif' >> /vds_build_dir/include/bluetooth/l2cap.h && \
            cd /vds_build_dir && \
            TARGET_FILE=\$(grep -rl \"l2_family = AF_BLUETOOTH\" .) && \
            echo \"Patche Datei: \${TARGET_FILE}\" && \
            sed -i -E 's/([A-Za-z0-9_]+)\\.l2_family\\s*=\\s*AF_BLUETOOTH;/memset(\\&\\1, 0, sizeof(\1)); \\1.l2_family = AF_BLUETOOTH; \\1.l2_bdaddr_type = 0;/' \"\${TARGET_FILE}\" && \
            sed -i -E 's/bind\\(([^,]+),\\s*\\(struct sockaddr\\s*\\*\\)\\s*\\&([A-Za-z0-9_]+),\\s*sizeof\\([^)]+\\)\\)/bind(\\1, (struct sockaddr*)\\&\\2, 16)/g' \"\${TARGET_FILE}\""

        # 4. Daemon kompilieren (Verknüpfung über den lokalen Header-Pfad)
        RUN cd /vds_build_dir && \
            sed -i '/pkg_check_modules.*bluez/c\set(bluez_FOUND TRUE)\nset(bluez_INCLUDE_DIRS "/vds_build_dir/include")\nset(bluez_LIBRARIES "")' CMakeLists.txt && \
            sed -i 's/PkgConfig::BLUEZ//g' CMakeLists.txt && \
            mkdir -p build && cd build && \
            cmake .. -DCMAKE_BUILD_TYPE=Release \
                     -DCMAKE_C_FLAGS="-I/vds_build_dir/include -Wno-address-of-packed-member" \
                     -DCMAKE_CXX_FLAGS="-I/vds_build_dir/include -Wno-address-of-packed-member" && \
            make
            
        # 5. RPM-Paketstruktur vorbereiten (PKG_ROOT) inklusive Systemd- & SELinux-Härtung
        RUN KERNEL_VERSION=$(rpm -q kernel --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}\n' | head -n 1) && \
            PKG_ROOT="/vds-pkg-root" && \
            mkdir -p "${PKG_ROOT}/usr/lib/modules/${KERNEL_VERSION}/extra" && \
            mkdir -p "${PKG_ROOT}/usr/lib/modules-load.d" && \
            mkdir -p "${PKG_ROOT}/usr/bin" && \
            mkdir -p "${PKG_ROOT}/usr/lib/systemd/system/bluetooth.service.d" && \
            mkdir -p "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service.d" && \
            mkdir -p "${PKG_ROOT}/usr/share/dbus-1/system.d" && \
            mkdir -p "${PKG_ROOT}/usr/lib/udev/rules.d" && \
            cp /vds_build_dir/module/vds_hcd.ko "${PKG_ROOT}/usr/lib/modules/${KERNEL_VERSION}/extra/" && \
            chmod 644 "${PKG_ROOT}/usr/lib/modules/${KERNEL_VERSION}/extra/vds_hcd.ko" && \
            find /vds_build_dir/build -type f -name "vdsd" -exec cp {} "${PKG_ROOT}/usr/bin/vdsd" \; && \
            find /vds_build_dir/build -type f -name "vdsctl" -exec cp {} "${PKG_ROOT}/usr/bin/vdsctl" \; && \
            chmod 755 "${PKG_ROOT}/usr/bin/vdsd" "${PKG_ROOT}/usr/bin/vdsctl" && \
            printf "vds_hcd\n" > "${PKG_ROOT}/usr/lib/modules-load.d/vds.conf" && \
            printf "[Service]\nExecStart=\nExecStart=/usr/libexec/bluetooth/bluetoothd --compat\n" > "${PKG_ROOT}/usr/lib/systemd/system/bluetooth.service.d/override.conf" && \
            printf "[Unit]\nDescription=Virtual DualSense Userspace Daemon\nAfter=bluetooth.service vds-chmod-sdp.service\nRequires=bluetooth.service\n\n[Service]\nType=simple\nExecStartPre=/usr/bin/mkdir -p /var/lib/vdsd\nStateDirectory=vdsd\nWorkingDirectory=/var/lib/vdsd\nExecStart=/usr/bin/vdsd\nRestart=always\nRestartSec=5\nSELinuxContext=system_u:system_r:unconfined_service_t:s0\nAmbientCapabilities=CAP_NET_RAW CAP_SYS_ADMIN\nCapabilityBoundingSet=CAP_NET_RAW CAP_SYS_ADMIN\n\n[Install]\nWantedBy=multi-user.target\n" > "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service" && \
            printf "[Unit]\nDescription=Setze Berechtigungen für vDS SDP-Socket wenn er erscheint\n\n[Service]\nType=oneshot\nExecStart=/usr/bin/chmod 0777 /run/sdp\nRemainAfterExit=yes\n" > "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.service" && \
            printf "[Unit]\nDescription=Überwache BlueZ SDP-Socket für vDS\n\n[Path]\nPathChanged=/run/sdp\nUnit=vds-chmod-sdp.service\n\n[Install]\nWantedBy=multi-user.target\n" > "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.path" && \
            printf "[Service]\nNetworkNamespacePath=\nPrivateNetwork=no\nRestrictAddressFamilies=AF_BLUETOOTH AF_UNIX AF_INET\n" > "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service.d/99-network-fix.conf" && \
            printf "<!DOCTYPE busconfig PUBLIC \"-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN\"\n \"http://freedesktop.org\">\n<busconfig>\n  <policy user=\"root\">\n    <allow own=\"org.vdsd\"/>\n    <allow send_destination=\"org.vdsd\"/>\n  </policy>\n  <policy context=\"default\">\n    <allow send_destination=\"org.vdsd\"/>\n  </policy>\n</busconfig>\n" > "${PKG_ROOT}/usr/share/dbus-1/system.d/org.vdsd.conf" && \
            cp /vds_build_dir/99-vds-dualsense-udev.rules "${PKG_ROOT}/usr/lib/udev/rules.d/99-vds-dualsense-udev.rules" && \
            printf 'KERNEL=="uinput", MODE="0660", GROUP="input", SECLABEL{selinux}="system_u:object_r:input_device_t:s0", OPTIONS+="static_node=uinput"\n' > "${PKG_ROOT}/usr/lib/udev/rules.d/99-vds-uinput.rules" && \
            printf 'KERNEL=="vds[0-9]*", MODE="0660", GROUP="input", SECLABEL{selinux}="system_u:object_r:input_device_t:s0"\n' >> "${PKG_ROOT}/usr/lib/udev/rules.d/99-vds-uinput.rules"

        # 6. Natives RPM via rpmbuild generieren und installieren
        RUN KERNEL_VERSION=$(rpm -q kernel --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}\n' | head -n 1) && \
            mkdir -p /root/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS} && \
            echo "Name: kmod-vds" > /root/rpmbuild/SPECS/vds.spec && \
            echo "Version: 1.0.0" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "Release: 1" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "Summary: Virtual DualSense Driver" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "License: MIT" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "%description" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "Virtual DualSense Driver und Daemon für Bazzite." >> /root/rpmbuild/SPECS/vds.spec && \
            echo "%post" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/sbin/restorecon -R /usr/bin/vdsd /usr/bin/vdsctl /usr/lib/systemd/system/vdsd.service || true" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "%files" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/lib/modules/${KERNEL_VERSION}/extra/vds_hcd.ko" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/lib/modules-load.d/vds.conf" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/bin/vdsd" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/bin/vdsctl" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "%dir /usr/lib/systemd/system/bluetooth.service.d" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/lib/systemd/system/bluetooth.service.d/override.conf" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "%dir /usr/lib/systemd/system/vdsd.service.d" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/lib/systemd/system/vdsd.service.d/99-network-fix.conf" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/lib/systemd/system/vdsd.service" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/lib/systemd/system/vds-chmod-sdp.service" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/lib/systemd/system/vds-chmod-sdp.path" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/share/dbus-1/system.d/org.vdsd.conf" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/lib/udev/rules.d/99-vds-dualsense-udev.rules" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/lib/udev/rules.d/99-vds-uinput.rules" >> /root/rpmbuild/SPECS/vds.spec && \
            rpmbuild --define "_topdir /root/rpmbuild" --buildroot=/vds-pkg-root -bb /root/rpmbuild/SPECS/vds.spec && \
            rpm -ivh --nodeps /root/rpmbuild/RPMS/x86_64/kmod-vds-1.0.0-1.x86_64.rpm

        # 7. Atomares Aufräumen & Depmod-Triggering
        RUN KERNEL_VERSION=$(rpm -q kernel --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}\n' | head -n 1) && \
            depmod -a -b / "${KERNEL_VERSION}" && \
            systemctl enable vdsd.service && \
            systemctl enable vds-chmod-sdp.path && \
            rm -rf /vds_build_dir /vds-pkg-root /root/rpmbuild

