# yaml-language-server: $schema=https://blue-build.org 
name: vds-blueprint-bazzite
description: "Personalized Bazzite image featuring native integration of the vDS driver and daemon (v0.4.0), operating entirely in userspace"
base-image: ghcr.io/ublue-os/bazzite
image-version: latest

modules:
  - type: rpm-ostree
    install:
      - kernel-devel
      - kernel-headers
      - akmods
      - make
      - gcc
      - gcc-c++
      - cmake
      - git
      - dbus-devel
      - opus-devel
      - systemd-devel
      - libudev-devel

  - type: containerfile
    snippets:
      - |
        # Block 1: Clone vDS upstream repository (v0.4.0 Upstream Release)
        RUN git clone --depth 1 https://github.com/hurryman2212/vds.git /vds_build_dir

        # Block 2: Ermittle die exakte Kernel-Version des Bazzite-Ziel-Images (WICHTIGER REFIX)
        RUN KERNEL_VERSION=$(basename $(ls -d /usr/lib/modules/*fc* | head -n 1)) && \
            KERNEL_BUILD_DIR="/usr/src/kernels/${KERNEL_VERSION}" && \
            if [ ! -d "${KERNEL_BUILD_DIR}" ]; then KERNEL_BUILD_DIR=$(ls -d /usr/src/kernels/* | head -n 1); fi && \
            cd /vds_build_dir/module && \
            make KCFLAGS="-w" KERNELRELEASE="${KERNEL_VERSION}" KERNELDIR="${KERNEL_BUILD_DIR}"

        # Block 3: Generate standalone local headers for isolated build context (ORIGINAL & UNBERÜHRT)
        RUN mkdir -p /vds_build_dir/include/bluetooth && \
            cat << 'EOF' > /vds_build_dir/include/bluetooth/bluetooth.h
        #ifndef __BLUETOOTH_H
        #define __BLUETOOTH_H
        #include <stdint.h>
        #include <sys/socket.h>
        #include <string.h>
        #include <stdio.h>
        #ifndef AF_BLUETOOTH
        #define AF_BLUETOOTH 31
        #endif
        #ifndef PF_BLUETOOTH
        #define PF_BLUETOOTH AF_BLUETOOTH
        #endif
        #define BTPROTO_L2CAP 0
        typedef struct { uint8_t b[6]; } __attribute__((packed)) bdaddr_t;
        static inline int bacmp(const bdaddr_t *ba1, const bdaddr_t *ba2) { return memcmp(ba1, ba2, 6); }
        static inline void bacpy(bdaddr_t *dst, const bdaddr_t *src) { memcpy(dst, src, 6); }
        static inline uint16_t htobs(uint16_t n) { return n; }
        static inline int ba2str(const bdaddr_t *ba, char *str) { 
            return sprintf(str, "%02x:%02x:%02x:%02x:%02x:%02x", ba->b[5], ba->b[4], ba->b[3], ba->b[2], ba->b[1], ba->b[0]); 
        }
        #endif
        EOF

        RUN cat << 'EOF' > /vds_build_dir/include/bluetooth/l2cap.h
        #ifndef __L2CAP_H
        #define __L2CAP_H
        #include <bluetooth/bluetooth.h>
        #ifdef __cplusplus
        extern "C" {
        #endif
        struct sockaddr_l2 {
        	sa_family_t l2_family;
        	uint16_t l2_psm;
        	bdaddr_t l2_bdaddr;
        	uint16_t l2_cid;
        	uint8_t l2_bdaddr_type;
        };
        #ifdef __cplusplus
        }
        #endif
        #ifdef __cplusplus
        static_assert(sizeof(struct sockaddr_l2) == 14, "KRITISCH: Struktur-Groesse weicht von 14 Byte ab!");
        #else
        _Static_assert(sizeof(struct sockaddr_l2) == 14, "KRITISCH: Struktur-Groesse weicht von 14 Byte ab!");
        #endif
        #endif
        EOF

        # BLOCK 4: QUELLCODE-VORBEREITUNG & DAEMON-PATCHES (STANDARDISIERTES 110-BYTE UNIX-IPC)
        # 1. Proxy-Quellcode in das Build-Verzeichnis kopieren
        COPY vds-proxy.c /vds_build_dir/vds-proxy.c

        # 2. CMakeLists.txt patchen: BlueZ-Bibliothekszwang aushebeln
        RUN cd /vds_build_dir && \
            sed -i '/pkg_check_modules.*bluez/c\set(bluez_FOUND TRUE)\nset(bluez_INCLUDE_DIRS "/vds_build_dir/include")\nset(bluez_LIBRARIES "")' CMakeLists.txt && \
            sed -i 's/PkgConfig::BLUEZ//g' CMakeLists.txt

        # 3. Erstellung der modifizierten fill_l2cap_sockaddr (Nutzt echtes sockaddr_un Layout mit 110 Bytes)
        RUN echo '#include <sys/un.h>' > /tmp/new_func.cc && \
            echo 'namespace vds { namespace {' >> /tmp/new_func.cc && \
            echo 'void fill_l2cap_sockaddr(sockaddr_l2 &sockaddr, std::uint16_t psm, std::span<const std::uint8_t, 6> address) {' >> /tmp/new_func.cc && \
            echo '    struct sockaddr_un *un_addr = reinterpret_cast<struct sockaddr_un*>(&sockaddr);' >> /tmp/new_func.cc && \
            echo '    std::memset(un_addr, 0, sizeof(struct sockaddr_un));' >> /tmp/new_func.cc && \
            echo '    un_addr->sun_family = AF_UNIX;' >> /tmp/new_func.cc && \
            echo '    if (psm == 0x0011) {' >> /tmp/new_func.cc && \
            echo '        std::memcpy(&un_addr->sun_path[1], "v_c", 3);' >> /tmp/new_func.cc && \
            echo '    } else {' >> /tmp/new_func.cc && \
            echo '        std::memcpy(&un_addr->sun_path[1], "v_i", 3);' >> /tmp/new_func.cc && \
            echo '    }' >> /tmp/new_func.cc && \
            echo '}' >> /tmp/new_func.cc && \
            echo '}}' >> /tmp/new_func.cc

        # BLOCK 4: QUELLCODE-VORBEREITUNG & DAEMON-PATCHES (STANDARDISIERTES 110-BYTE UNIX-IPC)
        # 1. Proxy-Quellcode in das Build-Verzeichnis kopieren
        COPY vds-proxy.c /vds_build_dir/vds-proxy.c

        # 2. CMakeLists.txt patchen: BlueZ-Bibliothekszwang aushebeln
        RUN cd /vds_build_dir && \
            sed -i '/pkg_check_modules.*bluez/c\set(bluez_FOUND TRUE)\nset(bluez_INCLUDE_DIRS "/vds_build_dir/include")\nset(bluez_LIBRARIES "")' CMakeLists.txt && \
            sed -i 's/PkgConfig::BLUEZ//g' CMakeLists.txt

        # 3. vds_bt.cc auf AF_UNIX umstellen (Zwingt socket() zu lokalen Sockets)
        RUN cd /vds_build_dir && \
            sed -i 's/AF_BLUETOOTH/AF_UNIX/g' src/platform/linux/vds_bt.cc

        # 4. Alle harten Bluetooth-Größenstrukturen im Code auf die 110 Byte von sockaddr_un aufbohren
        RUN cd /vds_build_dir && \
            sed -i 's/sizeof(sockaddr_l2)/sizeof(struct sockaddr_un)/g' src/platform/linux/vds_bt.cc && \
            sed -i 's/sizeof(sockaddr)/sizeof(struct sockaddr_un)/g' src/platform/linux/vds_bt.cc && \
            sed -i 's/sizeof(peer)/sizeof(struct sockaddr_un)/g' src/platform/linux/vds_bt.cc

        # 5. SICHERE INJEKTION: Wir hängen unsere 110-Byte-Funktionen ans Ende des anonymen Namespaces an
        RUN echo '#include <sys/un.h>' > /tmp/append_code.cc && \
            echo 'namespace vds { namespace {' >> /tmp/append_code.cc && \
            echo 'void fill_l2cap_sockaddr(sockaddr_l2 &sockaddr, std::uint16_t psm, std::span<const std::uint8_t, 6> address) {' >> /tmp/append_code.cc && \
            echo '    struct sockaddr_un *un_addr = reinterpret_cast<struct sockaddr_un*>(&sockaddr);' >> /tmp/append_code.cc && \
            echo '    std::memset(un_addr, 0, sizeof(struct sockaddr_un));' >> /tmp/un_addr->sun_family = AF_UNIX;' >> /tmp/append_code.cc && \
            echo '    if (psm == 0x0011) {' >> /tmp/append_code.cc && \
            echo '        std::memcpy(&un_addr->sun_path, "v_c", 3);' >> /tmp/append_code.cc && \
            echo '    } else {' >> /tmp/append_code.cc && \
            echo '        std::memcpy(&un_addr->sun_path, "v_i", 3);' >> /tmp/append_code.cc && \
            echo '    }' >> /tmp/append_code.cc && \
            echo '}' >> /tmp/append_code.cc && \
            echo 'std::optional<BtAcceptedChannel> accept_l2cap_psm(int listener_fd, std::uint16_t psm) {' >> /tmp/append_code.cc && \
            echo '    struct sockaddr_un peer;' >> /tmp/append_code.cc && \
            echo '    std::memset(&peer, 0, sizeof(struct sockaddr_un));' >> /tmp/append_code.cc && \
            echo '    socklen_t peer_size = sizeof(struct sockaddr_un);' >> /tmp/append_code.cc && \
            echo '    int fd_net = ::accept(listener_fd, reinterpret_cast<struct sockaddr*>(&peer), &peer_size);' >> /tmp/append_code.cc && \
            echo '    if (fd_net < 0) {' >> /tmp/append_code.cc && \
            echo '        int error = errno;' >> /tmp/append_code.cc && \
            echo '        if (error == EAGAIN || error == EWOULDBLOCK || error == EINTR) return {};' >> /tmp/append_code.cc && \
            echo '        throw std::runtime_error("Failed to accept");' >> /tmp/append_code.cc && \
            echo '    }' >> /tmp/append_code.cc && \
            echo '    if (::fcntl(fd_net, F_SETFD, FD_CLOEXEC) < 0) throw std::runtime_error("fcntl");' >> /tmp/append_code.cc && \
            echo '    set_nonblocking(fd_net, "socket");' >> /tmp/append_code.cc && \
            echo '    return BtAcceptedChannel{.address = "00:1b:dc:00:00:00", .fd = vds::UniqueFd(fd_net)};' >> /tmp/append_code.cc && \
            echo '}' >> /tmp/append_code.cc && \
            echo '}}' >> /tmp/append_code.cc && \
            cd /vds_build_dir && \
            cat /tmp/append_code.cc >> src/platform/linux/vds_bt.cc && \
            rm -f /tmp/append_code.cc

        # 6. vDS-Leerlaufabsicherung: Verhindern, dass got == 0 die Pipeline zerreißt
        RUN cd /vds_build_dir && \
            sed -i 's/if (got == 0)/if (false)/g' src/platform/linux/vds_bt.cc

        # 7. vdsd.cc patchen: Hardwareerkennung (BlueZ-Modalias) starr umleiten
        RUN cd /vds_build_dir && \
            sed -i 's/vds::bluez_device_modalias(address);/std::string("usb:v054Cp0CE6d0100");/g' src/platform/linux/vdsd.cc
            
        # BLOCK 5: SYSTEM-KONFIGURATIONEN (SYSTEMD, UDEV, ALSA)
        RUN KERNEL_VERSION=$(rpm -q kernel --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}\n' | head -n 1) && \
            PKG_ROOT="/vds-pkg-root" && \
            mkdir -p "${PKG_ROOT}/usr/lib/modules/${KERNEL_VERSION}/extra" && \
            mkdir -p "${PKG_ROOT}/usr/lib/modules-load.d" && \
            mkdir -p "${PKG_ROOT}/usr/bin" && \
            mkdir -p "${PKG_ROOT}/usr/lib/systemd/system/bluetooth.service.d" && \
            mkdir -p "${PKG_ROOT}/usr/lib/systemd/system-preset" && \
            mkdir -p "${PKG_ROOT}/usr/share/dbus-1/system.d" && \
            mkdir -p "${PKG_ROOT}/usr/lib/udev/rules.d" && \
            mkdir -p "${PKG_ROOT}/usr/share/vdsd" && \
            mkdir -p "${PKG_ROOT}/etc/wireplumber/wireplumber.conf.d" && \
            mkdir -p "${PKG_ROOT}/usr/lib/systemd/system" && \
            printf "vds_hcd\n" > "${PKG_ROOT}/usr/lib/modules-load.d/vds.conf" && \
            printf "enable vdsd.service\nenable vds-proxy.service\nenable vds-chmod-sdp.path\n" > "${PKG_ROOT}/usr/lib/systemd/system-preset/99-vds.preset" && \
            ( \        
              echo '[Unit]'; echo 'Description=vDS Dynamic Bluetooth Socket Router'; \
              echo 'After=bluetooth.service systemd-udevd.service'; echo 'Requires=bluetooth.service'; echo ''; \
              echo '[Service]'; echo 'Type=idle'; echo 'ExecStartPre=/usr/bin/sleep 5'; \
              echo 'ExecStart=/usr/bin/vds-proxy'; echo 'Restart=always'; echo 'RestartSec=5'; echo 'User=root'; \
              echo 'CapabilityBoundingSet=CAP_NET_RAW CAP_SYS_ADMIN CAP_NET_ADMIN CAP_NET_BIND_SERVICE'; \
              echo 'AmbientCapabilities=CAP_NET_RAW CAP_SYS_ADMIN CAP_NET_ADMIN CAP_NET_BIND_SERVICE'; echo 'Nice=-10'; echo ''; \
              echo '[Install]'; echo 'WantedBy=multi-user.target'; \
            ) > "${PKG_ROOT}/usr/lib/systemd/system/vds-proxy.service" && \
            ( \
              echo '[Unit]'; echo 'Description=Virtual DualSense Userspace Daemon'; \
              echo 'After=bluetooth.service vds-proxy.service'; echo 'Requires=bluetooth.service vds-proxy.service'; echo ''; \
              echo '[Service]'; echo 'Type=idle'; echo 'ExecStartPre=/usr/bin/mkdir -p /var/lib/vdsd'; \
              echo 'ExecStartPre=/usr/bin/chmod 666 /dev/uhid'; echo 'ExecStartPre=/usr/bin/sleep 7'; \
              echo 'ExecStart=/usr/bin/vdsd'; echo 'Restart=always'; echo 'RestartSec=5'; echo 'User=root'; \
              echo 'ProtectSystem=false'; echo 'ProtectHome=false'; echo 'PrivateTmp=no'; echo 'PrivateDevices=no'; \
              echo 'PrivateNetwork=no'; \
              echo 'CapabilityBoundingSet=CAP_NET_RAW CAP_SYS_ADMIN CAP_NET_ADMIN CAP_NET_BIND_SERVICE CAP_SYS_RAWIO'; \
              echo 'AmbientCapabilities=CAP_NET_RAW CAP_SYS_ADMIN CAP_NET_ADMIN CAP_NET_BIND_SERVICE CAP_SYS_RAWIO'; \
              echo 'Nice=-10'; echo ''; echo '[Install]'; echo 'WantedBy=multi-user.target'; \
            ) > "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service" && \
            printf "[Unit]\nDescription=Setze Berechtigungen für vDS SDP-Socket\n\n[Service]\nType=oneshot\nExecStart=/usr/bin/chmod 0777 /run/sdp\nRemainAfterExit=yes\n" > "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.service" && \
            printf "[Unit]\nDescription=Überwache BlueZ SDP-Socket für vDS\n\n[Path]\nPathChanged=/run/sdp\nUnit=vds-chmod-sdp.service\n\n[Install]\nWantedBy=multi-user.target\n" > "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.path" && \
            printf "[Service]\nExecStart=\nExecStart=/usr/libexec/bluetooth/bluetoothd --compat\n" > "${PKG_ROOT}/usr/lib/systemd/system/bluetooth.service.d/override.conf" && \
            printf "[General]\nClassicBondedOnly=false\n" > "${PKG_ROOT}/usr/share/vdsd/main.conf" && \
            printf "<!DOCTYPE busconfig PUBLIC \"-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN\"\n \"http://freedesktop.org\">\n<busconfig>\n  <policy user=\"root\">\n    <allow own=\"org.vds\"/>\n    <allow send_destination=\"org.vds\"/>\n  </policy>\n  <policy context=\"default\">\n    <allow send_destination=\"org.vds\"/>\n  </policy>\n</busconfig>\n" > "${PKG_ROOT}/usr/share/dbus-1/system.d/org.vds.conf" && \
            ( \
              echo '# Filtert auf das Hauptgerät im input-Subsystem'; echo 'SUBSYSTEM!="input", GOTO="vds_end"'; \
              echo 'KERNEL!="event*", GOTO="vds_end"'; echo 'ATTR{name}!="DualSense Wireless Controller", GOTO="vds_end"'; \
              echo ''; echo 'ACTION!="add", GOTO="vds_end"'; echo ''; \
              echo 'RUN+="/usr/bin/vdsctl attach \$attr{properties/uniq}"'; echo ''; echo 'LABEL="vds_end"'; \
            ) > "${PKG_ROOT}/usr/lib/udev/rules.d/99-vds-dualsense-udev.rules" && \
            printf 'KERNEL=="uinput", MODE="0660", GROUP="input", OPTIONS+="static_node=uinput"\n' > "${PKG_ROOT}/usr/lib/udev/rules.d/99-vds-uinput.rules" && \
            printf 'KERNEL=="vds[0-9]*", MODE="0660", GROUP="input", TAG+="systemd"\n' >> "${PKG_ROOT}/usr/lib/udev/rules.d/99-vds-uinput.rules" && \
            ( \
              echo 'monitor.alsa.rules = ['; echo '  {'; echo '    matches = [ { node.name = "~alsa_output.usb-Sony_Interactive_Entertainment.*" } ]'; \
              echo '    actions = {'; echo '      update-props = {'; echo '        alsa.card_id        = "WirelessController"'; \
              echo '        alsa.card_name      = "WirelessController"'; echo '        device.nick         = "WirelessController"'; \
              echo '        node.name           = "alsa_output.usb-Sony_Interactive_Entertainment_WirelessController-00.pro-audio"'; \
              echo '        node.description    = "WirelessController"'; echo '        node.nick           = "WirelessController"'; \
              echo '        api.alsa.use-acp    = false'; echo '        audio.channels      = 4'; \
              echo '        audio.position      = [ "FL", "FR", "RL", "RR" ]'; echo '        priority.driver     = 1500'; \
              echo '        priority.session    = 1500'; echo '        session.suspend-on-idle = false'; \
              echo '      }'; echo '    }'; echo '  },'; echo '  {'; \
              echo '    matches = [ { node.name = "~alsa_output.pci.*DualSense.*" }, { node.name = "~alsa_input.pci.*DualSense.*" }, { node.description = "~.*DualSense wireless controller.*" } ]'; \
              echo '    actions = { update-props = { device.disabled = true; node.disabled = true } }'; echo '  }'; echo ']'; \
            ) > "${PKG_ROOT}/etc/wireplumber/wireplumber.conf.d/99-vds-prioritisation.conf"
            
        # BLOCK 6: BUILD & RPM-PAKETIERUNG
        RUN KERNEL_VERSION=$(rpm -q kernel --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}\n' | head -n 1) && \
            PKG_ROOT="/vds-pkg-root" && \
            cp /vds_build_dir/module/vds_hcd.ko "${PKG_ROOT}/usr/lib/modules/${KERNEL_VERSION}/extra/vds_hcd.ko" && \
            chmod 644 "${PKG_ROOT}/usr/lib/modules/${KERNEL_VERSION}/extra/vds_hcd.ko" && \
            cd /vds_build_dir && mkdir -p build && cd build && \
            cmake .. -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_FLAGS="-isystem /vds_build_dir/include" -DCMAKE_CXX_FLAGS="-isystem /vds_build_dir/include" && \
            make -j$(nproc) && \
            gcc -O3 -Wall /vds_build_dir/vds-proxy.c -o /vds_build_dir/build/vds-proxy && \
            cp /vds_build_dir/build/vdsd "${PKG_ROOT}/usr/bin/vdsd" && \
            cp /vds_build_dir/build/vdsctl "${PKG_ROOT}/usr/bin/vdsctl" && \
            cp /vds_build_dir/build/vds-proxy "${PKG_ROOT}/usr/bin/vds-proxy" && \
            chmod 755 "${PKG_ROOT}/usr/bin/vdsd" "${PKG_ROOT}/usr/bin/vdsctl" "${PKG_ROOT}/usr/bin/vds-proxy" && \
            mkdir -p /root/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS} && \
            ( \
              echo 'Name: kmod-vds'; echo 'Version: 1.0.0'; echo 'Release: 1'; \
              echo 'Summary: Virtual DualSense Driver'; echo 'License: MIT'; echo ''; \
              echo '%description'; echo 'Virtual DualSense Driver und Daemon.'; echo ''; \
              echo '%files'; \
              echo '/usr/lib/modules/'"${KERNEL_VERSION}"'/extra/vds_hcd.ko'; \
              echo '/usr/lib/modules-load.d/vds.conf'; \
              echo '/usr/lib/systemd/system-preset/99-vds.preset'; \
              echo '/usr/bin/vdsd'; echo '/usr/bin/vdsctl'; echo '/usr/bin/vds-proxy'; \
              echo '/usr/lib/systemd/system/vdsd.service'; echo '/usr/lib/systemd/system/vds-proxy.service'; \
              echo '/usr/lib/systemd/system/vds-chmod-sdp.service'; echo '/usr/lib/systemd/system/vds-chmod-sdp.path'; \
              echo '/usr/share/dbus-1/system.d/org.vds.conf'; \
              echo '/usr/lib/udev/rules.d/99-vds-uinput.rules'; echo '/usr/lib/udev/rules.d/99-vds-dualsense-udev.rules'; \
              echo '/etc/wireplumber/wireplumber.conf.d/99-vds-prioritisation.conf'; \
              echo '/usr/lib/systemd/system/bluetooth.service.d/override.conf'; echo '/usr/share/vdsd/main.conf'; \
            ) > /root/rpmbuild/SPECS/vds.spec && \
            rpmbuild --define "_topdir /root/rpmbuild" --buildroot=/vds-pkg-root -bb /root/rpmbuild/SPECS/vds.spec && \
            mkdir -p /tmp/vds-rpm && \
            cp /root/rpmbuild/RPMS/x86_64/kmod-vds-1.0.0-1.x86_64.rpm /tmp/vds-rpm/

        # BLOCK 7: EXTRAKTION & SYSTEM-INTEGRATION
        RUN rpm2cpio /tmp/vds-rpm/kmod-vds-1.0.0-1.x86_64.rpm | cpio -idmv -D / && \
            KERNEL_VERSION=$(rpm -q kernel --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}\n' | head -n 1) && \
            depmod -a "${KERNEL_VERSION}" && \
            mkdir -p /usr/lib/systemd/system/multi-user.target.wants && \
            ln -sf /usr/lib/systemd/system/vds-proxy.service \
                   /usr/lib/systemd/system/multi-user.target.wants/vds-proxy.service && \
            ln -sf /usr/lib/systemd/system/vdsd.service \
                   /usr/lib/systemd/system/multi-user.target.wants/vdsd.service && \
            ln -sf /usr/lib/systemd/system/vds-chmod-sdp.path \
                   /usr/lib/systemd/system/multi-user.target.wants/vds-chmod-sdp.path && \
            rm -rf /vds_build_dir /vds-pkg-root /tmp/vds-rpm /root/rpmbuild
