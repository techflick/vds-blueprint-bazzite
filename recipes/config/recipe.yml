# yaml-language-server: $schema=https://blue-build.org
name: mein-bazzite-vds
description: "Mein persönliches Bazzite mit nativer Integration des vDS Treibers und Daemons ohne Distrobox."

base-image: ghcr.io/ublue-os/bazzite
image-version: latest

modules:
  - type: rpm-ostree
    install:
      - kernel-devel
      - make
      - gcc
      - gcc-c++
      - cmake
      - git
      - dbus-devel
      - opus-devel
      - rpm-build

  - type: containerfile
    snippets:
      - |
        # Schritt 1: vDS-Repository frisch klonen
        RUN git clone --depth 1 https://github.com/hurryman2212/vds.git /vds_build_dir

        # Schritt 2: Kernel-Modul kompilieren, Bluetooth-Timeouts härten & lokale Header flach erzeugen
        RUN KERNEL_VERSION=$(rpm -q kernel --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}\n' | head -n 1) && \
            KERNEL_BUILD_DIR="/usr/src/kernels/${KERNEL_VERSION}" && \
            cd /vds_build_dir/module && \
            make KCFLAGS="-w" KERNELRELEASE="${KERNEL_VERSION}" KERNELDIR="${KERNEL_BUILD_DIR}" && \
            \
            mkdir -p /etc/bluetooth && \
            echo '[General]' > /etc/bluetooth/main.conf && \
            echo 'Name = Bazzite-vDS-Host' >> /etc/bluetooth/main.conf && \
            echo 'Class = 0x000100' >> /etc/bluetooth/main.conf && \
            echo '[LE]' >> /etc/bluetooth/main.conf && \
            echo 'MinConnectionInterval=7' >> /etc/bluetooth/main.conf && \
            echo 'MaxConnectionInterval=9' >> /etc/bluetooth/main.conf && \
            echo 'ConnectionLatency=0' >> /etc/bluetooth/main.conf && \
            echo 'SupervisionTimeout=300' >> /etc/bluetooth/main.conf && \
            \
            mkdir -p /vds_build_dir/include/bluetooth && \
            echo '#ifndef __BLUETOOTH_H' > /vds_build_dir/include/bluetooth/bluetooth.h && \
            echo '#define __BLUETOOTH_H' >> /vds_build_dir/include/bluetooth/bluetooth.h && \
            echo '#include <stdint.h>' >> /vds_build_dir/include/bluetooth/bluetooth.h && \
            echo '#include <sys/socket.h>' >> /vds_build_dir/include/bluetooth/bluetooth.h && \
            echo '#include <string.h>' >> /vds_build_dir/include/bluetooth/bluetooth.h && \
            echo '#include <stdio.h>' >> /vds_build_dir/include/bluetooth/bluetooth.h && \
            echo '#ifndef AF_BLUETOOTH' >> /vds_build_dir/include/bluetooth/bluetooth.h && \
            echo '#define AF_BLUETOOTH 31' >> /vds_build_dir/include/bluetooth/bluetooth.h && \
            echo '#endif' >> /vds_build_dir/include/bluetooth/bluetooth.h && \
            echo '#ifndef PF_BLUETOOTH' >> /vds_build_dir/include/bluetooth/bluetooth.h && \
            echo '#define PF_BLUETOOTH AF_BLUETOOTH' >> /vds_build_dir/include/bluetooth/bluetooth.h && \
            echo '#endif' >> /vds_build_dir/include/bluetooth/bluetooth.h && \
            echo '#define BTPROTO_L2CAP 0' >> /vds_build_dir/include/bluetooth/bluetooth.h && \
            echo 'typedef struct { uint8_t b[6]; } __attribute__((packed)) bdaddr_t;' >> /vds_build_dir/include/bluetooth/bluetooth.h && \
            echo 'static inline int bacmp(const bdaddr_t *ba1, const bdaddr_t *ba2) { return memcmp(ba1, ba2, 6); }' >> /vds_build_dir/include/bluetooth/bluetooth.h && \
            echo 'static inline void bacpy(bdaddr_t *dst, const bdaddr_t *src) { memcpy(dst, src, 6); }' >> /vds_build_dir/include/bluetooth/bluetooth.h && \
            echo 'static inline uint16_t htobs(uint16_t n) { return n; }' >> /vds_build_dir/include/bluetooth/bluetooth.h && \
            echo 'static inline int ba2str(const bdaddr_t *ba, char *str) { return sprintf(str, "%02x:%02x:%02x:%02x:%02x:%02x", ba->b[5], ba->b[4], ba->b[3], ba->b[2], ba->b[1], ba->b[0]); }' >> /vds_build_dir/include/bluetooth/bluetooth.h && \
            echo '#endif' >> /vds_build_dir/include/bluetooth/bluetooth.h && \
            \
            echo '#ifndef __L2CAP_H' > /vds_build_dir/include/bluetooth/l2cap.h && \
            echo '#define __L2CAP_H' >> /vds_build_dir/include/bluetooth/l2cap.h && \
            echo '#include <bluetooth/bluetooth.h>' >> /vds_build_dir/include/bluetooth/l2cap.h && \
            echo '#ifdef __cplusplus' >> /vds_build_dir/include/bluetooth/l2cap.h && \
            echo 'extern "C" {' >> /vds_build_dir/include/bluetooth/l2cap.h && \
            echo '#endif' >> /vds_build_dir/include/bluetooth/l2cap.h && \
            echo 'struct sockaddr_l2 {' >> /vds_build_dir/include/bluetooth/l2cap.h && \
            echo '	sa_family_t l2_family;' >> /vds_build_dir/include/bluetooth/l2cap.h && \
            echo '	uint16_t l2_psm;' >> /vds_build_dir/include/bluetooth/l2cap.h && \
            echo '	bdaddr_t l2_bdaddr;' >> /vds_build_dir/include/bluetooth/l2cap.h && \
            echo '	uint16_t l2_cid;' >> /vds_build_dir/include/bluetooth/l2cap.h && \
            echo '	uint8_t l2_bdaddr_type;' >> /vds_build_dir/include/bluetooth/l2cap.h && \
            echo '};' >> /vds_build_dir/include/bluetooth/l2cap.h && \
            echo '#ifdef __cplusplus' >> /vds_build_dir/include/bluetooth/l2cap.h && \
            echo '}' >> /vds_build_dir/include/bluetooth/l2cap.h && \
            echo 'static_assert(sizeof(struct sockaddr_l2) == 14, "KRITISCH: Struktur-Groesse weicht von 14 Byte ab!");' >> /vds_build_dir/include/bluetooth/l2cap.h && \
            echo '#else' >> /vds_build_dir/include/bluetooth/l2cap.h && \
            echo '_Static_assert(sizeof(struct sockaddr_l2) == 14, "KRITISCH: Struktur-Groesse weicht von 14 Byte ab!");' >> /vds_build_dir/include/bluetooth/l2cap.h && \
            echo '#endif' >> /vds_build_dir/include/bluetooth/l2cap.h && \
            echo '#endif' >> /vds_build_dir/include/bluetooth/l2cap.h

        # Schritt 3 (Teil A): Daemon kompilieren und C++ Handshake- & uinput-Patches anwenden
        RUN cd /vds_build_dir && \
            echo 'set(bluez_FOUND TRUE)' > /tmp/cmake.patch && \
            echo 'set(bluez_INCLUDE_DIRS "/vds_build_dir/include")' >> /tmp/cmake.patch && \
            echo 'set(bluez_LIBRARIES "")' >> /tmp/cmake.patch && \
            sed -i '/pkg_check_modules.*bluez/r /tmp/cmake.patch' CMakeLists.txt && \
            sed -i '/pkg_check_modules.*bluez/d' CMakeLists.txt && \
            sed -i 's/PkgConfig::BLUEZ//g' CMakeLists.txt && \
            echo '#include <linux/uinput.h>' > /tmp/proxy.patch && \
            echo '#include <fstream>' >> /tmp/proxy.patch && \
            echo '#include <filesystem>' >> /tmp/proxy.patch && \
            echo '#include <cctype>' >> /tmp/proxy.patch && \
            echo '#include <thread>' >> /tmp/proxy.patch && \
            echo '#include <chrono>' >> /tmp/proxy.patch && \
            echo '#include <fcntl.h>' >> /tmp/proxy.patch && \
            echo '#include <unistd.h>' >> /tmp/proxy.patch && \
            echo '#include <sys/poll.h>' >> /tmp/proxy.patch && \
            echo '#include <sys/ioctl.h>' >> /tmp/proxy.patch && \
            echo '#include <cstring>' >> /tmp/proxy.patch && \
            echo '#include <vector>' >> /tmp/proxy.patch && \
            echo '#include <csignal>' >> /tmp/proxy.patch && \
            echo '#include <sys/socket.h>' >> /tmp/proxy.patch && \
            echo '#include <errno.h>' >> /tmp/proxy.patch && \
            echo '#include <iostream>' >> /tmp/proxy.patch && \
            echo 'struct PendingUinputProxy { std::string address; int control_fd = -1; int interrupt_fd = -1; };' >> /tmp/proxy.patch && \
            echo 'inline std::vector<PendingUinputProxy> g_pending_proxies;' >> /tmp/proxy.patch && \
            echo 'inline bool get_bluez_device_info(const std::string& t_mac, uint16_t& vendor, uint16_t& product, std::string& name) {' >> /tmp/proxy.patch && \
            echo '  std::string m_low = t_mac; for (auto &c : m_low) c = std::tolower(c);' >> /tmp/proxy.patch && \
            echo '  std::string m_up = t_mac; for (auto &c : m_up) c = std::toupper(c);' >> /tmp/proxy.patch && \
            echo '  std::string b_p = "/var/lib/bluetooth/"; if (!std::filesystem::exists(b_p)) return false;' >> /tmp/proxy.patch && \
            echo '  for (const auto& entry : std::filesystem::directory_iterator(b_p)) {' >> /tmp/proxy.patch && \
            echo '    if (!entry.is_directory()) continue;' >> /tmp/proxy.patch && \
            echo '    std::string path_low = entry.path().string() + "/" + m_low + "/info";' >> /tmp/proxy.patch && \
            echo '    std::string path_up = entry.path().string() + "/" + m_up + "/info";' >> /tmp/proxy.patch && \
            echo '    std::string target_path = "";' >> /tmp/proxy.patch && \
            echo '    if (std::filesystem::exists(path_low)) target_path = path_low;' >> /tmp/proxy.patch && \
            echo '    else if (std::filesystem::exists(path_up)) target_path = path_up;' >> /tmp/proxy.patch && \
            echo '    if (!target_path.empty()) {' >> /tmp/proxy.patch && \
            echo '      std::ifstream file(target_path); std::string line;' >> /tmp/proxy.patch && \
            echo '      while (std::getline(file, line)) {' >> /tmp/proxy.patch && \
            echo '        if (line.find("Name=") == 0) name = line.substr(5);' >> /tmp/proxy.patch && \
            echo '        if (line.find("Vendor=") == 0) vendor = std::stoul(line.substr(7), nullptr, 16);' >> /tmp/proxy.patch && \
            echo '        if (line.find("Product=") == 0) product = std::stoul(line.substr(8), nullptr, 16);' >> /tmp/proxy.patch && \
            echo '      }' >> /tmp/proxy.patch && \
            echo '      return true;' >> /tmp/proxy.patch && \
            echo '    }' >> /tmp/proxy.patch && \
            echo '  } return false;' >> /tmp/proxy.patch && \
            echo '}' >> /tmp/proxy.patch && \
            echo 'inline void emit_event(int fd, uint16_t type, uint16_t code, int32_t val) {' >> /tmp/proxy.patch && \
            echo '  struct input_event ie; std::memset(&ie, 0, sizeof(ie)); ie.type = type; ie.code = code; ie.value = val;' >> /tmp/proxy.patch && \
            echo '  ::write(fd, &ie, sizeof(ie));' >> /tmp/proxy.patch && \
            echo '}' >> /tmp/proxy.patch && \
            echo 'inline void setup_abs_axis(int fd, uint16_t code) {' >> /tmp/proxy.patch && \
            echo '  struct uinput_abs_setup s; std::memset(&s, 0, sizeof(s)); s.code = code; s.absinfo.minimum = 0; s.absinfo.maximum = 255; ::ioctl(fd, UI_ABS_SETUP, &s);' >> /tmp/proxy.patch && \
            echo '}' >> /tmp/proxy.patch && \
            # Schritt 3 (Teil B): Proxy-Worker & Compilierung
            echo 'inline void run_uinput_proxy_worker(std::string address, int control_fd, int interrupt_fd) {' >> /tmp/proxy.patch && \
            echo '  int opt = 1;' >> /tmp/proxy.patch && \
            echo '  ::setsockopt(control_fd, SOL_SOCKET, SO_REUSEADDR, &opt, sizeof(opt));' >> /tmp/proxy.patch && \
            echo '  ::setsockopt(interrupt_fd, SOL_SOCKET, SO_REUSEADDR, &opt, sizeof(opt));' >> /tmp/proxy.patch && \
            echo '  ::fcntl(control_fd, F_SETFL, O_NONBLOCK);' >> /tmp/proxy.patch && \
            echo '  ::fcntl(interrupt_fd, F_SETFL, O_NONBLOCK);' >> /tmp/proxy.patch && \
            echo '  std::this_thread::sleep_for(std::chrono::milliseconds(200));' >> /tmp/proxy.patch && \
            echo '  uint16_t vendor = 0x054c; uint16_t product = 0x0ce6; std::string device_name = "DualSense Wireless Controller";' >> /tmp/proxy.patch && \
            echo '  get_bluez_device_info(address, vendor, product, device_name);' >> /tmp/proxy.patch && \
            echo '  int uinput_fd = ::open("/dev/uinput", O_WRONLY | O_NONBLOCK); if (uinput_fd < 0) { ::close(control_fd); ::close(interrupt_fd); return; }' >> /tmp/proxy.patch && \
            echo '  struct uinput_setup us; std::memset(&us, 0, sizeof(us)); us.id.bustype = BUS_BLUETOOTH;' >> /tmp/proxy.patch && \
            echo '  us.id.vendor = vendor; us.id.product = product; std::strncpy(us.name, device_name.c_str(), UINPUT_MAX_NAME_SIZE);' >> /tmp/proxy.patch && \
            echo '  ::ioctl(uinput_fd, UI_SET_EVBIT, EV_KEY); ::ioctl(uinput_fd, UI_SET_KEYBIT, BTN_SOUTH); ::ioctl(uinput_fd, UI_SET_KEYBIT, BTN_EAST); ::ioctl(uinput_fd, UI_SET_KEYBIT, BTN_NORTH); ::ioctl(uinput_fd, UI_SET_KEYBIT, BTN_WEST);' >> /tmp/proxy.patch && \
            echo '  ::ioctl(uinput_fd, UI_SET_KEYBIT, BTN_TL); ::ioctl(uinput_fd, UI_SET_KEYBIT, BTN_TR); ::ioctl(uinput_fd, UI_SET_KEYBIT, BTN_SELECT); ::ioctl(uinput_fd, UI_SET_KEYBIT, BTN_START); ::ioctl(uinput_fd, UI_SET_KEYBIT, BTN_MODE);' >> /tmp/proxy.patch && \
            echo '  ::ioctl(uinput_fd, UI_SET_EVBIT, EV_ABS); ::ioctl(uinput_fd, UI_SET_ABSBIT, ABS_X); ::ioctl(uinput_fd, UI_SET_ABSBIT, ABS_Y); ::ioctl(uinput_fd, UI_SET_ABSBIT, ABS_Z); ::ioctl(uinput_fd, UI_SET_ABSBIT, ABS_RZ); ::ioctl(uinput_fd, UI_SET_ABSBIT, ABS_HAT0X); ::ioctl(uinput_fd, UI_SET_ABSBIT, ABS_HAT0Y);' >> /tmp/proxy.patch && \
            echo '  ::ioctl(uinput_fd, UI_DEV_SETUP, &us); setup_abs_axis(uinput_fd, ABS_X); setup_abs_axis(uinput_fd, ABS_Y); setup_abs_axis(uinput_fd, ABS_Z); setup_abs_axis(uinput_fd, ABS_RZ); ::ioctl(uinput_fd, UI_DEV_CREATE);' >> /tmp/proxy.patch && \
            echo '  struct pollfd p_fds[2]; std::memset(p_fds, 0, sizeof(p_fds)); p_fds[0].fd = control_fd; p_fds[0].events = POLLIN; p_fds[1].fd = interrupt_fd; p_fds[1].events = POLLIN;' >> /tmp/proxy.patch && \
            echo '  std::uint8_t buffer[1024];' >> /tmp/proxy.patch && \
            echo '  while (true) {' >> /tmp/proxy.patch && \
            echo '    int ret = ::poll(p_fds, 2, 50);' >> /tmp/proxy.patch && \
            echo '    if (ret > 0) {' >> /tmp/proxy.patch && \
            echo '      if (p_fds[0].revents & POLLIN) {' >> /tmp/proxy.patch && \
            echo '        ssize_t bytes = ::read(control_fd, buffer, sizeof(buffer));' >> /tmp/proxy.patch && \
            echo '        if (bytes <= 0) break;' >> /tmp/proxy.patch && \
            echo '      }' >> /tmp/proxy.patch && \
            echo '      if (p_fds[1].revents & POLLIN) {' >> /tmp/proxy.patch && \
            echo '        ssize_t bytes = ::read(interrupt_fd, buffer, sizeof(buffer));' >> /tmp/proxy.patch && \
            echo '        if (bytes <= 0) break;' >> /tmp/proxy.patch && \
            echo '        if (bytes >= 5 && buffer[0] == 0x01) {' >> /tmp/proxy.patch && \
            echo '          int16_t lx = buffer[1]; int16_t ly = buffer[2];' >> /tmp/proxy.patch && \
            echo '          emit_event(uinput_fd, EV_ABS, ABS_X, lx); emit_event(uinput_fd, EV_ABS, ABS_Y, ly);' >> /tmp/proxy.patch && \
            echo '          emit_event(uinput_fd, EV_SYN, 0, 0);' >> /tmp/proxy.patch && \
            echo '        }' >> /tmp/proxy.patch && \
            echo '      }' >> /tmp/proxy.patch && \
            echo '    } else if (ret < 0) { if(errno != EINTR && errno != EAGAIN) break; }' >> /tmp/proxy.patch && \
            echo '  }' >> /tmp/proxy.patch && \
            echo '  ::ioctl(uinput_fd, UI_DEV_DESTROY); ::close(uinput_fd); ::close(control_fd); ::close(interrupt_fd);' >> /tmp/proxy.patch && \
            echo '}' >> /tmp/proxy.patch && \
            echo 'inline void handle_fallback_wrapper(const std::string& address, int fd, bool control_channel) {' >> /tmp/proxy.patch && \
            echo '  for (auto it = g_pending_proxies.begin(); it != g_pending_proxies.end(); ++it) { if (it->address == address) { if (control_channel) it->control_fd = fd; else it->interrupt_fd = fd; if (it->control_fd >= 0 && it->interrupt_fd >= 0) { std::thread(run_uinput_proxy_worker, it->address, it->control_fd, it->interrupt_fd).detach(); g_pending_proxies.erase(it); break; } return; } }' >> /tmp/proxy.patch && \
            echo '  PendingUinputProxy p; p.address = address; if (control_channel) p.control_fd = fd; else p.interrupt_fd = fd; g_pending_proxies.push_back(p);' >> /tmp/proxy.patch && \
            echo '}' >> /tmp/proxy.patch && \
            TARGET_VDSD=$(find . -name vdsd.cc | head -n 1) && \
            cat /tmp/proxy.patch >> "$TARGET_VDSD" && \
            sed -i 's/handle_uinput_fallback(address, fd, true);/handle_fallback_wrapper(address, fd, true);/g' "$TARGET_VDSD" && \
            sed -i 's/handle_uinput_fallback(address, fd, false);/handle_fallback_wrapper(address, fd, false);/g' "$TARGET_VDSD" && \
            mkdir -p build && cd build && \
            cmake -DCMAKE_BUILD_TYPE=Release .. && \
            make -j$(nproc)

                # Schritt 4: RPM-Paketstruktur vorbereiten (PKG_ROOT) inklusive Systemd- & Udev-Injektion
        RUN KERNEL_VERSION=$(rpm -q kernel --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}\n' | head -n 1) && \
            PKG_ROOT="/vds-pkg-root" && \
            mkdir -p "${PKG_ROOT}/usr/bin" && \
            cp /vds_build_dir/build/vdsd "${PKG_ROOT}/usr/bin/vdsd" && \
            cp /vds_build_dir/build/vdsctl "${PKG_ROOT}/usr/bin/vdsctl" && \
            mkdir -p "${PKG_ROOT}/usr/lib/modules/${KERNEL_VERSION}/extra" && \
            cp /vds_build_dir/module/vds_hcd.ko "${PKG_ROOT}/usr/lib/modules/${KERNEL_VERSION}/extra/" && \
            mkdir -p "${PKG_ROOT}/usr/lib/modules-load.d" && \
            echo "vds_hcd" > "${PKG_ROOT}/usr/lib/modules-load.d/vds.conf" && \
            mkdir -p "${PKG_ROOT}/usr/share/dbus-1/system.d" && \
            echo '<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"' > "${PKG_ROOT}/usr/share/dbus-1/system.d/org.vdsd.conf" && \
            echo ' "http://freedesktop.org">' >> "${PKG_ROOT}/usr/share/dbus-1/system.d/org.vdsd.conf" && \
            echo '<busconfig>' >> "${PKG_ROOT}/usr/share/dbus-1/system.d/org.vdsd.conf" && \
            echo '  <policy user="root">' >> "${PKG_ROOT}/usr/share/dbus-1/system.d/org.vdsd.conf" && \
            echo '    <allow own="org.vdsd"/>' >> "${PKG_ROOT}/usr/share/dbus-1/system.d/org.vdsd.conf" && \
            echo '    <allow send_destination="org.vdsd"/>' >> "${PKG_ROOT}/usr/share/dbus-1/system.d/org.vdsd.conf" && \
            echo '  </policy>' >> "${PKG_ROOT}/usr/share/dbus-1/system.d/org.vdsd.conf" && \
            echo '  <policy context="default">' >> "${PKG_ROOT}/usr/share/dbus-1/system.d/org.vdsd.conf" && \
            echo '    <allow send_destination="org.vdsd"/>' >> "${PKG_ROOT}/usr/share/dbus-1/system.d/org.vdsd.conf" && \
            echo '  </policy>' >> "${PKG_ROOT}/usr/share/dbus-1/system.d/org.vdsd.conf" && \
            echo '</busconfig>' >> "${PKG_ROOT}/usr/share/dbus-1/system.d/org.vdsd.conf" && \
            mkdir -p "${PKG_ROOT}/usr/lib/systemd/system" && \
            echo '[Unit]' > "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service" && \
            echo 'Description=Virtual DualSense Daemon' >> "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service" && \
            echo 'After=bluetooth.service systemd-udevd.service' >> "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service" && \
            echo 'Requires=bluetooth.service' >> "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service" && \
            echo '[Service]' >> "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service" && \
            echo 'Type=simple' >> "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service" && \
            echo 'User=root' >> "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service" && \
            echo 'Group=root' >> "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service" && \
            echo 'ExecStart=/usr/bin/vdsd' >> "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service" && \
            echo 'Restart=always' >> "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service" && \
            echo 'RestartSec=3' >> "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service" && \
            echo 'DeviceAllow=/dev/uinput rw' >> "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service" && \
            echo 'PrivateNetwork=no' >> "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service" && \
            echo 'PrivateDevices=no' >> "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service" && \
            echo 'AmbientCapabilities=CAP_NET_RAW CAP_NET_ADMIN CAP_SYS_ADMIN' >> "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service" && \
            echo 'CapabilityBoundingSet=CAP_NET_RAW CAP_NET_ADMIN CAP_SYS_ADMIN' >> "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service" && \
            echo '[Install]' >> "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service" && \
            echo 'WantedBy=multi-user.target' >> "${PKG_ROOT}/usr/lib/systemd/system/vdsd.service" && \
            echo '[Unit]' > "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.service" && \
            echo 'Description=vDS SDP Permissions Workaround' >> "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.service" && \
            echo 'After=bluetooth.service' >> "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.service" && \
            echo '[Service]' >> "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.service" && \
            echo 'Type=oneshot' >> "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.service" && \
            echo 'ExecStart=/bin/chmod 777 /var/run/sdp' >> "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.service" && \
            echo 'RemainAfterExit=yes' >> "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.service" && \
            echo '[Install]' >> "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.path" && \
            echo '[Unit]' > "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.path" && \
            echo 'Description=Watch for BlueZ SDP Socket creation' >> "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.path" && \
            echo '[Path]' >> "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.path" && \
            echo 'PathExists=/var/run/sdp' >> "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.path" && \
            echo '[Install]' >> "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.path" && \
            echo 'WantedBy=multi-user.target' >> "${PKG_ROOT}/usr/lib/systemd/system/vds-chmod-sdp.path" && \
            mkdir -p "${PKG_ROOT}/usr/lib/systemd/system/bluetooth.service.d" && \
            echo '[Service]' > "${PKG_ROOT}/usr/lib/systemd/system/bluetooth.service.d/override.conf" && \
            echo 'ExecStart=' >> "${PKG_ROOT}/usr/lib/systemd/system/bluetooth.service.d/override.conf" && \
            echo 'ExecStart=/usr/libexec/bluetooth/bluetoothd --noplugin=input' >> "${PKG_ROOT}/usr/lib/systemd/system/bluetooth.service.d/override.conf" && \
            mkdir -p "${PKG_ROOT}/usr/etc/bluetooth" && \
            cp /etc/bluetooth/main.conf "${PKG_ROOT}/usr/etc/bluetooth/main.conf" && \
            mkdir -p "${PKG_ROOT}/usr/lib/udev/rules.d" && \
            echo 'KERNEL=="uinput", SUBSYSTEM=="misc", OPTIONS+="static_node=uinput", TAG+="systemd", MODE="0660", GROUP="input"' > "${PKG_ROOT}/usr/lib/udev/rules.d/99-vds-uinput.rules"

                # Schritt 5: Natives RPM via rpmbuild generieren und installieren (Pfad-Korrektur D-Bus)
        RUN KERNEL_VERSION=$(rpm -q kernel --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}\n' | head -n 1) && \
            DETECTED_ARCH=$(rpm -q kernel --queryformat '%{ARCH}\n' | head -n 1) && \
            mkdir -p /root/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS} && \
            echo "Name: kmod-vds" > /root/rpmbuild/SPECS/vds.spec && \
            echo "Version: 1.0.0" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "Release: 1" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "Summary: Virtual DualSense Driver" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "License: MIT" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "%description" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "Virtual DualSense Driver und Daemon mit integrierter uinput-Proxy Weiche für Bazzite." >> /root/rpmbuild/SPECS/vds.spec && \
            echo "%post" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/sbin/restorecon -R /usr/bin/vdsd /usr/bin/vdsctl /usr/lib/systemd/system/vdsd.service /usr/etc/bluetooth /usr/lib/udev/rules.d/99-vds-*.rules /var/lib/vdsd 2>/dev/null || true" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/bin/udevadm control --reload-rules 2>/dev/null || true" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/bin/udevadm trigger --action=change 2>/dev/null || true" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/bin/systemctl daemon-reload 2>/dev/null || true" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/bin/systemctl preset vdsd.service 2>/dev/null || true" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/bin/systemctl enable vdsd.service 2>/dev/null || true" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/bin/systemctl preset vds-chmod-sdp.path 2>/dev/null || true" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/bin/systemctl enable vds-chmod-sdp.path 2>/dev/null || true" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "%files" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/lib/modules/${KERNEL_VERSION}/extra/vds_hcd.ko" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/lib/modules-load.d/vds.conf" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/bin/vdsd" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/bin/vdsctl" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "%dir /usr/lib/systemd/system/bluetooth.service.d" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/lib/systemd/system/bluetooth.service.d/override.conf" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "%dir /usr/etc/bluetooth" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/etc/bluetooth/main.conf" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/lib/systemd/system/vdsd.service" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/lib/systemd/system/vds-chmod-sdp.service" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/lib/systemd/system/vds-chmod-sdp.path" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/share/dbus-1/system.d/org.vdsd.conf" >> /root/rpmbuild/SPECS/vds.spec && \
            echo "/usr/lib/udev/rules.d/99-vds-uinput.rules" >> /root/rpmbuild/SPECS/vds.spec && \
            \
            rpmbuild --define "_topdir /root/rpmbuild" --buildroot=/vds-pkg-root -bb /root/rpmbuild/SPECS/vds.spec && \
            rpm -Uvh --nodeps --force /root/rpmbuild/RPMS/${DETECTED_ARCH}/kmod-vds-1.0.0-1.${DETECTED_ARCH}.rpm

        # Schritt 6: Atomares Aufräumen & Modul-Abhängigkeiten indizieren
        RUN KERNEL_VERSION=$(rpm -q kernel --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}\n' | head -n 1) && \
            depmod -a -b / "${KERNEL_VERSION}" && \
            rm -rf /vds_build_dir /vds-pkg-root /root/rpmbuild

