# yaml-language-server: $schema=https://blue-build.org
name: mein-bazzite-vds
description: Mein persönliches Bazzite mit automatischer Aktivierung des vDS Treibers.

base-image: ghcr.io/ublue-os/bazzite
image-version: latest

# Das lädt die Build-Tools direkt im GitHub-Container, sodass sie sofort einsatzbereit sind
containerfiles:
  build:
    - RUN dnf install -y kernel-devel make gcc git

modules:
  - type: script
    snippets:
      - |
        bash -c '
          set -e # Bricht bei Fehlern sofort ab

          echo "=== 1. vDS Quellcode frisch klonen ==="
          rm -rf /tmp/vds_source
          git clone https://github.com/hurryman2212/vds.git /tmp/vds_source
          
          echo "=== 2. In den module-Ordner wechseln und bauen ==="
          cd /tmp/vds_source/module
          
          # Ermittle die genaue Kernel-Version des Ziel-Images
          KERNEL_VERSION=$(rpm -q --qf "%{VERSION}-%{RELEASE}.%{ARCH}\n" kernel | head -n 1)
          echo "Bauen für Kernel-Header in: ${KERNEL_VERSION}"
          
          # Bauvorgang starten
          make KCFLAGS="-w" KERNELDIR=/usr/lib/modules/${KERNEL_VERSION}/build
          
          echo "=== 3. Kernel-Modul an einen sicheren Ort kopieren ==="
          # Der Ordner "updates" bleibt beim Verpacken des Images garantiert erhalten
          MODULE_DEST="/usr/lib/modules/${KERNEL_VERSION}/updates"
          mkdir -p "${MODULE_DEST}"
          cp vds_hcd.ko "${MODULE_DEST}/"
          
          echo "=== 4. Kernel-Modul für automatischen Start registrieren ==="
          mkdir -p /usr/lib/modules-load.d
          echo "vds_hcd" > /usr/lib/modules-load.d/vds.conf

          echo "=== 5. Bluetooth-Anpassung aktivieren ==="
          mkdir -p /usr/lib/systemd/system/bluetooth.service.d
          cat << "EOF" > /usr/lib/systemd/system/bluetooth.service.d/override.conf
        [Service]
        ExecStart=
        ExecStart=/usr/libexec/bluetooth/bluetoothd --noplugin=input
        EOF

          echo "=== 6. Berechtigungen sicherstellen ==="
          chmod 644 "${MODULE_DEST}/vds_hcd.ko"
          
          echo "=== Build im Skript abgeschlossen. Blue-Build übernimmt den Rest! ==="
        '
