# yaml-language-server: $schema=https://blue-build.org
name: mein-bazzite-vds
description: Mein persönliches Bazzite mit integriertem vDS (virtual DualSense) Treiber.

base-image: ghcr.io/ublue-os/bazzite
image-version: latest

modules:
  # 1. Das Kernel-Modul automatisch über das offizielle akmods-Modul bauen lassen
  - type: akmods
    install:
      - vds

  # 2. Das Steuerprogramm direkt aus der fertigen .deb-Datei ins System entpacken
  # Du musst hier nur deinen funktionierenden Link zur .deb-Datei eintragen!
  - type: script
    snippets:
      - |
        echo "=== vDS Userspace Tools installieren ==="
        # Bitte setze hier in der nächsten Zeile deinen funktionierenden Link zur .deb ein:
        URL_ZUR_DEB=https://github.com/hurryman2212/vds/releases/download/0.3.0-rc7/vds_0.3.0.rc7-1_amd64.deb
        
        curl -L -o /tmp/vds.deb "$URL_ZUR_DEB"
        
        # Wir entpacken die Dateien direkt in das schreibgeschützte Image
        dpkg-deb -x /tmp/vds.deb /
        
        echo "=== Bluetooth-Anpassung aktivieren ==="
        # Da wir kein Git haben, schreiben wir die Service-Änderung direkt per Hand
        mkdir -p /etc/systemd/system/bluetooth.service.d
        cat << 'EOF' > /etc/systemd/system/bluetooth.service.d/override.conf
        [Service]
        ExecStart=
        ExecStart=/usr/libexec/bluetooth/bluetoothd --noplugin=input
        EOF
