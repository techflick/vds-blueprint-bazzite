# yaml-language-server: $schema=https://blue-build.org
name: mein-bazzite-vds
description: Mein persönliches Bazzite mit isoliertem Treiber-Build und sauberem Image.

base-image: ghcr.io/ublue-os/bazzite
image-version: latest

modules:
  # STAGE 1: Die isolierte Werkstatt (Hier installieren wir die Werkzeuge und bauen den Treiber)
  - type: script
    snippets:
      - |
        bash -c '
          set -e
          echo "=== [Isolierte Werkstatt] Installiere Build-Tools ==="
          # Diese Pakete landen NUR in der temporären Build-Umgebung und NIEMALS in deinem fertigen Bazzite!
          rpm-ostree install kernel-devel make gcc git

          echo "=== [Isolierte Werkstatt] Quellcode holen & kompilieren ==="
          rm -rf /tmp/vds_build
          git clone https://github.com/hurryman2212/vds.git /tmp/vds_build
          cd /tmp/vds_build/module
          
          KERNEL_VERSION=$(ls -1 /usr/src/kernels/ | head -n 1)
          KERNEL_BUILD_DIR="/usr/src/kernels/${KERNEL_VERSION}"
          
          make KCFLAGS="-w" KERNELRELEASE="${KERNEL_VERSION}" KERNELDIR="${KERNEL_BUILD_DIR}"
          
          echo "=== [Isolierte Werkstatt] Fertiges Modul sichern ==="
          # Wir retten die kompilierte Datei kurz in ein sicheres, temporäres Verzeichnis
          mkdir -p /tmp/vds_artifacts
          cp vds_hcd.ko /tmp/vds_artifacts/
          
          echo "=== [Isolierte Werkstatt] Werkzeuge rückstandslos entfernen ==="
          # Wir löschen die Compiler-Tools wieder, BEVOR die Stage abgeschlossen wird
          rpm-ostree uninstall kernel-devel make gcc git
          rm -rf /tmp/vds_build
        '

  # STAGE 2: Die saubere Integration (Hier richten wir nur noch die Konfigurationen im echten Image ein)
  - type: script
    snippets:
      - |
        bash -c '
          set -e
          echo "=== [Echtes Image] Erstelle System-Strukturen ==="
          KERNEL_VERSION=$(ls -1 /usr/lib/modules/ | head -n 1)
          
          mkdir -p "/usr/lib/modules/${KERNEL_VERSION}/extra"
          mkdir -p "/usr/lib/modules-load.d"
          mkdir -p "/usr/lib/systemd/system/bluetooth.service.d"
          mkdir -p "/usr/lib/tmpfiles.d"
          
          echo "=== [Echtes Image] Platziere Treiber und Konfigurationen ==="
          # Das sauber gebaute Modul an den finalen Platz legen
          cp /tmp/vds_artifacts/vds_hcd.ko "/usr/lib/modules/${KERNEL_VERSION}/extra/"
          chmod 644 "/usr/lib/modules/${KERNEL_VERSION}/extra/vds_hcd.ko"
          
          # Autoload für den Kernel aktivieren
          echo "vds_hcd" > "/usr/lib/modules-load.d/vds.conf"
          
          # Bluetooth-Kompatibilitätsmodus einbrennen
          cat << "EOF" > "/usr/lib/systemd/system/bluetooth.service.d/override.conf"
        [Service]
        ExecStart=
        ExecStart=/usr/libexec/bluetooth/bluetoothd --compat --noplugin=input
        EOF

          # Automatische 777-Rechte für /run/sdp bei jedem Systemstart
          echo "z /run/sdp 0777 root root -" > "/usr/lib/tmpfiles.d/vds-bluetooth.conf"
          
          echo "=== [Echtes Image] Aktualisiere Kernel-Index ==="
          depmod -a "${KERNEL_VERSION}"
          
          # Letzte Reste aus dem RAM/Temp löschen
          rm -rf /tmp/vds_artifacts
          echo "=== Build erfolgreich und spurlos sauber beendet! ==="
        '
