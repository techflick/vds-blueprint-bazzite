# yaml-language-server: $schema=https://blue-build.org
name: mein-bazzite-vds
description: Mein persönliches Bazzite mit automatischer Aktivierung des vDS Treibers.

base-image: ghcr.io/ublue-os/bazzite
image-version: latest

modules:
  - type: script
    snippets:
      - |
        bash -c '
          set -e # Bricht bei Fehlern sofort ab

          echo "=== 1. Benötigte Build-Tools installieren ==="
          rpm-ostree install kernel-devel make gcc git

          echo "=== 2. vDS Quellcode frisch klonen ==="
          rm -rf /tmp/vds_source
          git clone https://github.com /tmp/vds_source
          
          echo "=== 3. In den module-Ordner wechseln und bauen ==="
          # GEFIXT: Der Ordner im Repository heißt "module", nicht "driver"
          cd /tmp/vds_source/module
          
          # Ermittle die genaue Kernel-Version des Ziel-Images
          KERNEL_VERSION=$(rpm -q --qf "%{VERSION}-%{RELEASE}.%{ARCH}\n" kernel | head -n 1)
          echo "Bauen für Kernel-Header in: ${KERNEL_VERSION}"
          
          # Bauvorgang starten
          make KERNELDIR=/usr/lib/modules/${KERNEL_VERSION}/build
          
          echo "=== 4. Kernel-Modul an den ostree-konformen Ort kopieren ==="
          # /usr/lib/modules/extra ist im Build beschreibbar. Ostree verknüpft das beim Booten.
          MODULE_DEST="/usr/lib/modules/extra"
          mkdir -p "${MODULE_DEST}"
          cp vds_hcd.ko "${MODULE_DEST}/"
          
          echo "=== 5. Kernel-Modul für automatischen Start registrieren ==="
          mkdir -p /usr/lib/modules-load.d
          echo "vds_hcd" > /usr/lib/modules-load.d/vds.conf

          echo "=== 6. Bluetooth-Anpassung aktivieren ==="
          mkdir -p /usr/lib/systemd/system/bluetooth.service.d
          cat << "EOF" > /usr/lib/systemd/system/bluetooth.service.d/override.conf
        [Service]
        ExecStart=
        ExecStart=/usr/libexec/bluetooth/bluetoothd --noplugin=input
        EOF

          echo "=== 7. Initramfs für das finale Image aktualisieren ==="
          # Zwingt dracut, den Treiber aus dem extra-Ordner in die Boot-Ramdisk zu packen
          dracut --force --add-drivers vds_hcd --kver "${KERNEL_VERSION}"
          
          echo "=== Build erfolgreich abgeschlossen! ==="
        '
